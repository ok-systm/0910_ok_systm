<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強度計算kit（Web版）</title>
<style>
  :root{
    --navy:#1f3a5f; --navy-d:#16293f; --accent:#2b6cb0;
    --ok:#2f855a; --ng:#c53030; --bg:#eef1f5; --line:#d7dee6; --panelbg:#fbfcfe;
    --side-w:290px;
  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);margin:0;padding:0;color:#25313d;}

  /* ---------- 全体レイアウト ---------- */
  .topbar{background:var(--navy-d);color:#fff;padding:12px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;}
  .topbar h1 .ver{font-size:11px;font-weight:400;color:#9fb3ca;margin-left:6px;}
  .topbar .crumb{font-size:12.5px;color:#cfe0f2;}
  .layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto;}
  .side{width:var(--side-w);flex:0 0 var(--side-w);background:#fff;border-right:1px solid var(--line);height:calc(100vh - 46px);overflow-y:auto;position:sticky;top:0;padding:10px 0 40px;}
  .side .catTitle{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;margin:10px 0 2px;letter-spacing:.02em;}
  .side .catTitle:first-child{margin-top:0;}
  .navItem{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #f0f3f7;padding:7px 14px 7px 18px;font-size:12.5px;color:#374151;cursor:pointer;}
  .navItem:hover{background:#f3f7fb;}
  .navItem.active{background:#e5eefb;color:var(--navy-d);font-weight:700;border-left:3px solid var(--accent);padding-left:15px;}
  .navItem .tag{font-size:9.5px;padding:1px 6px;border-radius:8px;flex:0 0 auto;white-space:nowrap;}
  .navItem .tag.ready{background:#e6f4ea;color:var(--ok);}
  .navItem .tag.todo{background:#eef1f5;color:#9aa5b1;}
  .main{flex:1 1 auto;min-width:0;padding:20px 24px 60px;}
  .wrap{max-width:1180px;margin:0 auto;}

  h1.pageTitle{font-size:20px;color:var(--navy-d);text-align:center;border-bottom:3px solid var(--navy);padding-bottom:10px;margin:0 0 4px;}
  h1.pageTitle .sub{display:block;font-size:14.5px;color:var(--accent);margin-top:4px;font-weight:600;}
  h2.bar{font-size:14.5px;color:#fff;background:var(--navy);padding:7px 14px;border-radius:4px;margin:22px 0 0;}
  .sheet{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:0;align-items:start;}
  .cols .left{padding:16px 20px 16px 4px;border-right:1px dashed var(--line);}
  .cols .right{padding:16px 4px 16px 20px;background:var(--panelbg);}
  /* ============================================================
     Material Design ボトムシート＋FAB（スマホ専用）
  ============================================================ */
  .menu-fab{
    display:none;
    position:fixed;right:20px;bottom:24px;z-index:200;
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;
    align-items:center;justify-content:center;
    box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14),0 1px 18px rgba(0,0,0,.12);
    transition:box-shadow .2s,background .15s;
    padding:0;
  }
  .menu-fab svg{width:24px;height:24px;fill:#fff;}
  .menu-fab:active{background:var(--navy-d);box-shadow:0 7px 8px -4px rgba(0,0,0,.2),0 12px 17px rgba(0,0,0,.14);}

  /* スクリム（背景暗転） */
  .side-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.5);z-index:299;
    opacity:0;transition:opacity .25s;
  }
  .side-overlay.open{display:block;opacity:1;}

  /* 全画面モーダル */
  .bottom-sheet{
    display:none;
    position:fixed;inset:0;z-index:300;
    background:#fff;
    border-radius:0;
    overflow-y:auto;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    padding:0 0 env(safe-area-inset-bottom,0);
  }
  .bottom-sheet.open{display:block;transform:translateX(0);}
  .bottom-sheet-handle{display:none;}
  /* モーダルヘッダー（タイトル＋閉じるボタン） */
  .bottom-sheet-header{
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:1;
    background:var(--navy-d);
    padding:0 16px;
    height:52px;
    padding-top:env(safe-area-inset-top,0);
    font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em;
  }
  .bs-close-btn{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:50%;
    background:none;border:none;cursor:pointer;
    color:#fff;flex:0 0 auto;
    transition:background .15s;
  }
  .bs-close-btn:active{background:rgba(255,255,255,.2);}
  .bs-close-btn svg{width:22px;height:22px;fill:#fff;}
  .bs-nav-item{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;text-align:left;background:none;border:none;
    padding:14px 20px;font-size:15px;color:#1a202c;cursor:pointer;
    border-bottom:1px solid #f0f3f7;gap:10px;
    transition:background .12s;
  }
  .bs-nav-item:active{background:#f3f7fb;}
  .bs-nav-item.active{color:var(--accent);font-weight:700;background:#eff6ff;}
  .bs-nav-item .bs-id{font-size:12px;color:#9aa5b1;min-width:32px;}
  .bs-nav-item .bs-tag{font-size:11px;padding:2px 8px;border-radius:10px;flex:0 0 auto;}
  .bs-nav-item .bs-tag.ready{background:#e6f4ea;color:var(--ok);}
  .bs-nav-item .bs-tag.todo{background:#eef1f5;color:#9aa5b1;}
  .bs-cat-label{
    padding:10px 20px 4px;font-size:11px;font-weight:700;
    color:#fff;background:var(--accent);letter-spacing:.05em;
  }
  .bs-cat-label:first-child{padding-top:6px;}

  /* ============================================================
     PC・スマホ共通：rowline・free-row を縦列に統一
  ============================================================ */
  .rowline{
    display:flex;flex-direction:column;
    align-items:flex-start;gap:4px;
    padding:10px 0;border-bottom:1px solid #eef1f5;font-size:13px;
  }
  .rowline .lbl{color:#6b7280;font-weight:600;font-size:12px;min-width:auto;}
  .rowline .val{font-weight:700;color:#16293f;font-size:14px;}
  .rowline .val small{font-weight:400;color:#8996a3;margin-left:3px;font-size:12px;}
  .rowline input[type=text],
  .rowline input[type=number],
  .rowline select{
    width:100%;padding:8px 10px;
    border:1px solid #c7d0da;border-radius:8px;
    font-size:15px;background:#fff;
    box-sizing:border-box;
  }
  .rowline select{text-align:left;}

  .free-grid{display:grid;grid-template-columns:1fr;gap:0;margin:4px 0;}
  .free-row{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    padding:10px 0;border-bottom:1px solid #eef1f5;
  }
  .free-lbl{color:#6b7280;font-weight:600;font-size:12px;}
  .free-inp{
    width:100%;padding:8px 10px;
    border:1px solid #c7d0da;border-radius:8px;
    font-size:15px;background:#fff;text-align:left;
    box-sizing:border-box;
  }

  /* ============================================================
     タブレット（980px以下）
  ============================================================ */
  @media (max-width:980px){
    .layout{flex-direction:column;}
    .side{width:100%;flex:none;height:auto;position:relative;max-height:240px;overflow-y:auto;}
    .cols{grid-template-columns:1fr;}
    .cols .left{border-right:none;border-bottom:1px dashed var(--line);}
    .splitcols{grid-template-columns:1fr 1fr;}
  }

  /* ============================================================
     スマホ（600px以下）
  ============================================================ */
  @media (max-width:600px){
    .topbar{padding:10px 14px;}
    .topbar h1{font-size:15px;}
    .topbar .crumb{font-size:11px;}

    /* サイドナビ非表示（ボトムシートで代替） */
    .side{display:none;}
    .menu-fab{display:flex;}

    .main{padding:14px 12px 80px;}
    .wrap{max-width:100%;}

    h1.pageTitle{font-size:16px;}
    h1.pageTitle .sub{font-size:13px;}
    h2.bar{font-size:13px;padding:7px 12px;margin:16px 0 0;}
    .sheet{padding:14px 12px;}

    .cols{grid-template-columns:1fr;}
    .cols .left{padding:12px 0;border-right:none;border-bottom:1px dashed var(--line);}
    .cols .right{padding:12px 0;}
    .splitcols{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}

    .calc-line{font-size:12.5px;padding:6px 8px;margin:4px 0;overflow-x:auto;}
    .expl{font-size:13px;}
    .note-line{font-size:11.5px;}
    .sub-head{font-size:13px;}

    table.sect{font-size:11px;display:block;overflow-x:auto;}

    .btn{width:100%;padding:13px;font-size:15px;margin-top:12px;border-radius:8px;}
    .btnbar{padding:0;}
    .panel-title{font-size:12.5px;}
    .formula-ref{flex-direction:column;align-items:flex-start;gap:4px;font-size:12px;}
    .todoWrap{padding:24px 16px;}
    .todoWrap h2{font-size:16px;}
    .todoWrap p{font-size:13px;}
    .diagram-wrap svg,.diagram-wrap img{max-width:100%;height:auto;}
  }

  /* ============================================================
     共通コンポーネント
  ============================================================ */
  /* 計算書 */
  .lead{font-size:13px;color:#4a5568;margin:2px 0 10px;}
  .sub-head{font-weight:700;color:var(--navy-d);margin:16px 0 4px;font-size:14px;}
  .sub-head::before{content:"・";color:var(--accent);}
  .expl{font-size:13.5px;color:#374151;margin:4px 0;}
  .calc-line{font-family:"Consolas","Yu Gothic",monospace;background:#f7f9fc;border-left:3px solid var(--accent);
    padding:7px 12px;margin:5px 0 5px 8px;font-size:13.5px;color:#20303f;white-space:pre-wrap;line-height:1.65;}
  .note-line{font-size:12px;color:#8996a3;font-style:italic;margin:2px 0 2px 8px;}
  .diagram-wrap{text-align:center;margin:10px 0;padding:8px;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;}
  .diagram-label{font-size:12px;color:#4a5568;margin-top:4px;}
  .final{margin:14px 0;padding:12px;border-radius:6px;font-size:14.5px;font-weight:700;text-align:center;}
  .final-ok{background:#e6f4ea;color:var(--ok);border:1px solid #b7dfc4;}
  .final-ng{background:#fbe9e9;color:var(--ng);border:1px solid #eeb9b9;}

  /* パネル・ボタン・バッジ */
  .panel-title{font-weight:700;font-size:13px;color:#fff;background:var(--accent);padding:5px 10px;border-radius:4px;margin:14px 0 4px;}
  .panel-title:first-child{margin-top:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .checkline{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a5568;margin:4px 0;}
  table.sect{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0;}
  table.sect th,table.sect td{border:1px solid var(--line);padding:4px 6px;text-align:center;}
  table.sect th{background:#eef2f7;color:#374151;}
  .btn{background:var(--accent);color:#fff;border:none;padding:11px 34px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:700;margin-top:16px;}
  .btn:hover{background:var(--navy);}
  .btnbar{text-align:center;}
  .badge{display:inline-block;padding:2px 12px;border-radius:12px;font-weight:700;font-size:12px;color:#fff;}
  .badge-ok{background:var(--ok);} .badge-ng{background:var(--ng);} .badge-mute{background:#9aa5b1;}
  .splitcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;}
  .splitcols .box{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;}
  .splitcols .box h4{margin:0 0 6px;font-size:12.5px;color:var(--navy-d);text-align:center;background:#eef2f7;padding:4px;border-radius:3px;}
  .note{font-size:12px;color:#8996a3;margin-top:18px;line-height:1.7;padding:12px;background:#fff;border:1px solid var(--line);border-radius:6px;}
  .formula-ref{font-family:"Consolas",monospace;font-size:13px;color:#20303f;background:#f7f9fc;border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .formula-ref .tag{font-size:11px;color:#8996a3;white-space:nowrap;}

  /* 未実装シート用プレースホルダ */
  .todoWrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:40px 30px;text-align:center;color:#4a5568;}
  .todoWrap .bigTag{display:inline-block;background:#eef1f5;color:#8996a3;font-size:12px;padding:3px 14px;border-radius:12px;margin-bottom:14px;}
  .todoWrap h2{color:var(--navy-d);font-size:18px;margin:0 0 10px;}
  .todoWrap p{font-size:13.5px;line-height:1.8;max-width:560px;margin:0 auto;}
</style>
</head>
<body>
<div class="topbar">
  <h1>強度計算kit<span class="ver">Web版 完成版 v2.0</span></h1>
  <div class="crumb" id="crumb">読み込み中…</div>
</div>
</div>
<div class="side-overlay" id="overlay" onclick="closeNav()"></div>
<button class="menu-fab" id="menuFab" onclick="toggleNav()" aria-label="メニュー">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
</button>
<div class="bottom-sheet" id="bottomSheet">
  <div class="bottom-sheet-handle"></div>
  <div class="bottom-sheet-header">
    <span>メニュー</span>
    <button class="bs-close-btn" onclick="closeNav()" aria-label="閉じる">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="bottomSheetNav"></div>
</div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main"><div class="wrap" id="main"></div></main>
</div>

<script>
function toggleNav(){
  var sheet=document.getElementById('bottomSheet');
  var isOpen=sheet.classList.contains('open');
  if(isOpen){ closeNav(); } else {
    sheet.classList.add('open');
    document.body.style.overflow='hidden';
  }
}
function closeNav(){
  document.getElementById('side').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  document.body.style.overflow='';
}

/* ====================================================================
 * 共通ユーティリティ（Excel互換 ROUNDUP / ROUNDDOWN / ROUND ほか）
 * ================================================================== */
function phpRound(num, digits) {
  digits = digits || 0;
  var mult = Math.pow(10, digits);
  var v = num * mult;
  return (v >= 0 ? Math.round(v) : -Math.round(-v)) / mult;
}
function excelRoundup(num, digits) {
  digits = digits || 0;
  num = Number(num);
  var mult = Math.pow(10, digits);
  var val = phpRound(num * mult, 6);
  var result = num >= 0 ? Math.ceil(val) : Math.floor(val);
  return result / mult;
}
function excelRounddown(num, digits) {
  digits = digits || 0;
  num = Number(num);
  var mult = Math.pow(10, digits);
  var val = phpRound(num * mult, 6);
  var result = num >= 0 ? Math.floor(val) : Math.ceil(val);
  return result / mult;
}
function fnum(v, digits) {
  digits = (digits === undefined) ? 2 : digits;
  if (v === '' || v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return '-';
  var n = Number(v);
  var fixed = n.toFixed(digits);
  var parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.length > 1 ? parts.join('.') : parts[0];
}
function h(v) {
  var d = document.createElement('div');
  d.textContent = (v === null || v === undefined) ? '' : String(v);
  return d.innerHTML;
}
function rad2deg(r) { return r * 180 / Math.PI; }
function badge(ok) {
  if (ok === null || ok === undefined) return '<span class="badge badge-mute">-</span>';
  return ok ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-ng">NG</span>';
}
function cmp(ok) {
  if (ok === null || ok === undefined) return '-';
  return ok ? '≦' : '＞';
}
function fval(name, def) {
  var el = document.querySelector('[name="' + name + '"]');
  if (!el) return def;
  if (el.type === 'checkbox') return el.checked;
  var v = el.value;
  return (v === '' || v === null) ? def : v;
}

/* ====================================================================
 * 部材（断面性能）選択ブロック  ※どのシートでも共通の構造
 * ================================================================== */
function memberBlockHTML(preset) {
  return '' +
  '<div class="grid2">' +
    '<div>' +
      '<div class="checkline"><label><input type="radio" name="memberMode" value="list" onclick="toggleMemberMode()" checked> リスト選択（部材をリストから選ぶ）</label></div>' +
      '<div id="listBox" style="margin:6px 0 10px 20px;">' +
        '<select name="memberSelect" id="memberSelect">' +
          '<option value="preset" selected>' + h(preset.label) + '</option>' +
        '</select>' +
        '<div class="note-line" style="margin-left:0;">※他の部材は「任意入力」で断面性能を直接入力してください（元のExcelは部材データベースを外部ブックにリンクしていたため、実データが同梱されているのはこの1点のみです）</div>' +
      '</div>' +
      '<div class="checkline"><label><input type="radio" name="memberMode" value="free" onclick="toggleMemberMode()"> 任意入力（断面性能を直接入力）</label></div>' +
      '<div id="freeBox" style="margin:6px 0 0 20px;">' +
        '<div class="free-grid">' +
          '<div class="free-row"><span class="free-lbl">商品記号</span><input type="text" class="free-inp" name="freeName" value="' + h(preset.label) + '"></div>' +
          '<div class="free-row"><span class="free-lbl">板厚 (mm)</span><input type="number" step="any" class="free-inp" name="thickness" value="' + preset.thickness + '"></div>' +
          '<div class="free-row"><span class="free-lbl">単位重量 (kg/m)</span><input type="number" step="any" class="free-inp" name="weight" value="' + preset.weight + '"></div>' +
          '<div class="free-row"><span class="free-lbl">断面積 (mm²)</span><input type="number" step="any" class="free-inp" name="area" value="' + preset.area + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zx (mm³)</span><input type="number" step="any" class="free-inp" name="Zx" value="' + preset.Zx + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zy (mm³)</span><input type="number" step="any" class="free-inp" name="Zy" value="' + preset.Zy + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Ix (mm⁴)</span><input type="number" step="any" class="free-inp" name="Ix" value="' + preset.Ix + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Iy (mm⁴)</span><input type="number" step="any" class="free-inp" name="Iy" value="' + preset.Iy + '"></div>' +
          '<div class="free-row"><span class="free-lbl">ix (mm)</span><input type="number" step="any" class="free-inp" name="ix" value="' + preset.ix + '"></div>' +
          '<div class="free-row"><span class="free-lbl">iy (mm)</span><input type="number" step="any" class="free-inp" name="iy" value="' + preset.iy + '"></div>' +
          '<div class="free-row"><span class="free-lbl">短期F (N/mm²)</span><input type="number" step="any" class="free-inp" name="F_short" value="' + preset.F_short + '"></div>' +
          '<div class="free-row"><span class="free-lbl">長期F (N/mm²)</span><input type="number" step="any" class="free-inp" name="F_long" value="' + preset.F_long + '"></div>' +
          '<div class="free-row"><span class="free-lbl">E (N/mm²)</span><input type="number" step="any" class="free-inp" name="E" value="' + preset.E + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zpx (mm³)</span><input type="number" step="any" class="free-inp" name="Zpx" value="' + preset.Zpx + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zpy (mm³)</span><input type="number" step="any" class="free-inp" name="Zpy" value="' + preset.Zpy + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zu (mm³)</span><input type="number" step="any" class="free-inp" name="Zu" value="' + (preset.Zu || 0) + '"></div>' +
          '<div class="free-row"><span class="free-lbl">Zv (mm³)</span><input type="number" step="any" class="free-inp" name="Zv" value="' + (preset.Zv || 0) + '"></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div id="caseFields"></div>' +
  '</div>';
}
function toggleMemberMode() {
  var el = document.querySelector('input[name="memberMode"]:checked');
  if (!el) return;
  var v = el.value;
  document.getElementById('listBox').style.display = (v === 'list') ? 'block' : 'none';

  var xs = Math.round(xStart), xe = Math.round(xEnd);

  for (var xi = xs; xi <= xe; xi++) {
    var v = fn(xi);
    if (Math.abs(v) > bestAbs) { bestAbs = Math.abs(v); bestVal = v; bestX = xi; }
  }
  return { val: bestVal, x: bestX };
}

  run: function () {
    var preset = this.preset;
    var m = readMember(preset);
    var Zx = preset.Zx, Zy = preset.Zy, Ix = preset.Ix, Iy = preset.Iy;
    if (document.querySelector('input[name="memberMode"]:checked').value !== 'list') {

    var x = Number(fval('x', 500)), xEnabled = fval('xEnabled', false);

    var Z = (axis === 'X') ? Zx : Zy, I = (axis === 'X') ? Ix : Iy;

    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var R = excelRoundup(P / 2, 2);
    var Mmax = excelRoundup(P * L / 4, 2);
    var sigma_b = excelRoundup(Mmax / Z, 2);
    var sigma_b_judge = (sigma_b <= F);
    var delta_max = excelRoundup(P * Math.pow(L, 3) / (48 * E * I), 2);
    var L_over_deltamax = (delta_max !== 0) ? excelRounddown(L / delta_max, 0) : '-';
    var delta_max_judge = frexOn ? (Math.abs(delta_max) <= L / FREX) : null;
    var CHK1 = sigma_b_judge && (frexOn ? delta_max_judge : true);
    var thetaA = P * Math.pow(L, 2) / (16 * E * I);
    var thetaA_rad = excelRounddown(thetaA, 6), thetaA_deg = phpRound(rad2deg(thetaA), 4);

    var hasX = xEnabled, xJudgeText = '-', xsctCHK = null;

        delta_x = null, L_over_deltax = null, sigma_bx_judge = null, delta_x_judge = null,
        thetax = null, thetax_rad = null, thetax_deg = null, CHK2 = null;
    if (hasX) {
      xsctCHK = (x <= L / 2) ? 1 : 2;
      xJudgeText = (xsctCHK === 1) ? 'x≦L/2' : 'L/2≦x';
      if (xsctCHK === 1) {
        Mx1 = excelRoundup(P * x / 2, 2);
        delta_x1 = excelRoundup(P * x * (3 * Math.pow(L, 2) - 4 * Math.pow(x, 2)) / (48 * E * I), 2);

        thetax = -P * (Math.pow(L, 2) - 4 * Math.pow(Lx, 2)) / (16 * E * I);
        Mx = Mx2; delta_x = delta_x2;
      }
      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);
      L_over_deltax = (delta_x !== 0) ? excelRounddown(L / delta_x, 0) : '-';
      delta_x_judge = frexOn ? (Math.abs(delta_x) <= L / FREX) : null;
      thetax_rad = excelRounddown(thetax, 6); thetax_deg = phpRound(rad2deg(thetax), 4);
      CHK2 = sigma_bx_judge && (frexOn ? delta_x_judge : true);

    document.getElementById('titleSub').textContent = m.label + ' の強度計算';

      Z:Z, I:I, F:F, ZLabel:ZLabel, ILabel:ILabel, E:E,
      R:R, Mmax:Mmax, sigma_b:sigma_b, sigma_b_judge:sigma_b_judge,
      delta_max:delta_max, L_over_deltamax:L_over_deltamax, delta_max_judge:delta_max_judge, CHK1:CHK1,
      thetaA_rad:thetaA_rad, thetaA_deg:thetaA_deg,
      hasX:hasX, xJudgeText:xJudgeText, xsctCHK:xsctCHK, Mx1:Mx1, Mx2:Mx2, delta_x1:delta_x1, delta_x2:delta_x2,
      Mx:Mx, sigma_bx:sigma_bx, delta_x:delta_x, L_over_deltax:L_over_deltax,

  syncB: function () {

  },
  run: function () {
    this.syncB();
    var preset = this.preset;
    var mode = document.querySelector('input[name="memberMode"]:checked').value;
    var m = readMember(preset);
    var Zx = (mode === 'list') ? preset.Zx : Number(fval('Zx', preset.Zx));
    var Zy = (mode === 'list') ? preset.Zy : Number(fval('Zy', preset.Zy));
    var Ix = (mode === 'list') ? preset.Ix : Number(fval('Ix', preset.Ix));
    var Iy = (mode === 'list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 2000)), a = Number(fval('a', 1500)), b = L - a, P = Number(fval('P', 1000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);

    var E = m.E;
    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var RA = excelRoundup(P * b / L, 2), RB = excelRoundup(P * a / L, 2);
    var Mmax = excelRoundup(P * a * b / L, 2);
    var sigma_b = excelRoundup(Mmax / Z, 2), sigma_b_judge = (sigma_b <= F);

    var aLCHK = (a <= L / 2) ? 1 : 2;
    var deltaMaxX, deltaMax;
    if (aLCHK === 1) { deltaMaxX = phpRound(Math.sqrt(b * (b + 2 * a) / 3), 2); deltaMax = excelRoundup(P * a * Math.pow(L * L - a * a, 1.5) / (9 * Math.sqrt(3) * E * I * L), 2); }
    else { deltaMaxX = phpRound(Math.sqrt(a * (a + 2 * b) / 3), 2); deltaMax = excelRoundup(P * b * Math.pow(L * L - b * b, 1.5) / (9 * Math.sqrt(3) * E * I * L), 2); }
    var L_over_deltamax = (deltaMax !== 0) ? excelRounddown(L / deltaMax, 0) : '-';
    var deltaMax_judge = frexOn ? (Math.abs(deltaMax) <= L / FREX) : null;
    var CHK1 = sigma_b_judge && (frexOn ? deltaMax_judge : true);

    var thetaA = P * b * (L * L - b * b) / (6 * E * I * L);
    var thetaB = -P * a * (L * L - a * a) / (6 * E * I * L);

  syncB: function () {

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 3000)), a = Number(fval('a', 500)), b = L - 2 * a, P = Number(fval('P', 1000));

      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);
      L_over_deltax = (delta_x !== 0) ? excelRounddown(L / delta_x, 0) : '-';

      L_over_deltaa = (delta_a !== 0) ? excelRounddown(L / delta_a, 0) : '-';
      delta_a_judge = frexOn ? (delta_a <= L / FREX) : null;

  run: function () {
    var preset = this.preset;

    var Iy = (mode === 'list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 3000)), P = Number(fval('P', 1000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);

    var sigma_b = excelRoundup(Mmax / Z, 2), sigma_b_judge = (sigma_b <= F);

    var deltaMax_judge = frexOn ? (Math.abs(deltaMax) <= L / FREX) : null;

    var thetaA = P * L * L / (9 * E * I);

      delta_x_judge = frexOn ? (Math.abs(delta_x) <= L / FREX) : null;

      html += '<div class="panel-title">計算結果</div>';

      html += '<div class="rowline"><span class="lbl">σbx</span><span class="val">' + fnum(r.sigma_bx) + ' <small>N/mm²</small></span></div>';
      html += '<div class="rowline"><span class="lbl">σbx判定</span><span class="val">' + cmp(r.sigma_bx_judge) + ' ' + badge(r.sigma_bx_judge) + '</span></div>';

      html += '<div class="rowline"><span class="lbl">_CHK2</span><span class="val">' + badge(r.CHK2) + '</span></div>';

    html += '<h2 class="bar">④ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html += '<div class="formula-ref"><span>RA ＝ RB ＝ P</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ Px</span><span class="tag">〔0≦x≦L/3〕</span></div>';
    html += '<div class="formula-ref"><span>Mmax ＝ PL／3</span><span class="tag">〔L/3≦x≦2L/3〕</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ P(L－x)</span><span class="tag">〔2L/3≦x≦L〕</span></div>';
    html += '</div><div>';
    html += '<div class="formula-ref"><span>δmax ＝ 23PL³／(648EI)</span><span class="tag">〔AB間中央〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ Px(2L²－3x²)／(18EI)</span><span class="tag">〔0≦x≦L/3〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ PL(3Lx－3x²－L²／9)／(18EI)</span><span class="tag">〔L/3≦x≦2L/3〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ P(L-x){2L²－3(L-x)²}／(18EI)</span><span class="tag">〔2L/3≦x≦L〕</span></div>';
    html += '<div class="formula-ref"><span>θA ＝ －θB ＝ PL²／(9EI)</span></div>';
    html += '</div></div></div>';
    return html;
  }
};

/* -------------------- S5：単純梁 任意非対称二点集中荷重 -------------------- */
CASES.S5 = {
  preset: { label:'C-100×50×20×2.3', thickness:2.3, weight:4.035, area:517.217,
    Zx:16100, Zy:6060, Ix:807000, Iy:190000, ix:39.5, iy:19.2,
    F_short:205, F_long:136, Zu:0, Zv:0, E:205000, Zpx:18950, Zpy:8676 },
  delta1: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * (L - a) * (2 * L * a - a * a - x * x) + P2 * b * (L * L - b * b - x * x)) * x / (6 * E * I * L);
  },
  delta2: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * a * (L - x) * (2 * L * x - x * x - a * a) + P2 * b * x * (L * L - b * b - x * x)) / (6 * E * I * L);
  },
  delta3: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * a * (2 * L * x - x * x - a * a) + P2 * (L - b) * (2 * L * x - x * x - (L - b) * (L - b))) * (L - x) / (6 * E * I * L);
  },
  mount: function (main) {
    var preset = this.preset;
    main.innerHTML =
      '<h1 class="pageTitle">【単純梁 任意非対称二点集中荷重】<span class="sub" id="titleSub">' + h(preset.label) + ' の強度計算</span></h1>' +
      '<form id="calcForm" onsubmit="return false;">' +
        '<h2 class="bar">① 部材選択 ・ 設定値入力</h2>' +
        '<div class="sheet">' + memberBlockHTML(preset) + '<div class="btnbar"><button type="button" class="btn" onclick="CASES.S5.run()">計 算 す る</button></div></div>' +
      '</form>' +
      '<div id="results"></div>' +
      '<div class="note">※ この頁は元Excelの「S5」シートに対応します。荷重位置a（支点Aから荷重P1まで）・b（支点Bから荷重P2まで）を指定し、c＝L－a－bは自動計算されます。' +
      'たわみ最大値は元シートと同様、区間内を1mm刻みで走査して最大値を求めています。</div>';
    document.getElementById('caseFields').innerHTML =
      '<div class="rowline"><span class="lbl">支持長さ L</span><span><input type="number" step="any" name="L" value="3000" oninput="CASES.S5.syncC()"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">荷重位置 a</span><span><input type="number" step="any" name="a" value="800" oninput="CASES.S5.syncC()"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">荷重位置 b</span><span><input type="number" step="any" name="b" value="1000" oninput="CASES.S5.syncC()"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">c（＝L－a－b）</span><span><input type="number" step="any" name="c" value="1200" readonly style="background:#f3f5f8;"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">集中荷重 P1（a位置）</span><span><input type="number" step="any" name="P1" value="1000"> <small>N</small></span></div>' +
      '<div class="rowline"><span class="lbl">集中荷重 P2（L－b位置）</span><span><input type="number" step="any" name="P2" value="2000"> <small>N</small></span></div>' +
      '<div class="rowline"><span class="lbl">検討軸</span><span><select name="axis"><option value="X" selected>X（強軸）</option><option value="Y">Y（弱軸）</option></select></span></div>' +
      '<div class="rowline"><span class="lbl">検討期間</span><span><select name="term"><option value="短期" selected>短期</option><option value="長期">長期</option></select></span></div>' +
      '<div class="rowline"><span class="lbl">たわみ率 L/</span><span><input type="number" step="any" name="FREX" value="200"></span></div>' +
      '<div class="checkline"><input type="checkbox" name="frexOn" checked> たわみ判定を行う（ON）</div>' +
      '<div class="rowline"><span class="lbl">任意位置 x</span><span><input type="number" step="any" name="x" value="1523"> <small>mm</small></span></div>' +
      '<div class="checkline"><input type="checkbox" name="xEnabled" checked> 任意位置xの計算を行う</div>';
    toggleMemberMode();
    this.syncC();
  },
  syncC: function () {
    var L = Number(fval('L', 3000)), a = Number(fval('a', 800)), b = Number(fval('b', 1000));
    var c = L - a - b;
    var el = document.querySelector('[name="c"]');
    if (el) el.value = (isNaN(c) ? 0 : c);
    this.run();
  },
  run: function () {
    var preset = this.preset;
    var m = readMember(preset);
    var Zx = preset.Zx, Zy = preset.Zy, Ix = preset.Ix, Iy = preset.Iy;
    if (document.querySelector('input[name="memberMode"]:checked').value !== 'list') {
      Zx = m.Zx; Zy = Number(fval('Zy', preset.Zy)); Ix = m.Ix; Iy = Number(fval('Iy', preset.Iy));
    }
    var axis = fval('axis', 'X');
    var L = Number(fval('L', 3000)), a = Number(fval('a', 800)), b = Number(fval('b', 1000));
    var c = L - a - b;
    var P1 = Number(fval('P1', 1000)), P2 = Number(fval('P2', 2000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);
    var x = Number(fval('x', 1523)), xEnabled = fval('xEnabled', false);

    var Z = (axis === 'X') ? Zx : Zy, I = (axis === 'X') ? Ix : Iy;
    var F = (term === '短期') ? m.F_short : m.F_long;
    var E = m.E;
    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var RA = excelRoundup((P1 * (L - a) + P2 * b) / L, 2);
    var RB = excelRoundup((P1 * a + P2 * (L - b)) / L, 2);
    var M1 = excelRoundup((P1 * (L - a) + P2 * b) * a / L, 2);
    var M2 = excelRoundup((P1 * a + P2 * (L - b)) * b / L, 2);
    var MmaxLabel = (M1 >= M2) ? 'M1' : 'M2';
    var Mmax = (M1 >= M2) ? M1 : M2;
    var sigma_b = excelRoundup(Mmax / Z, 2);
    var sigma_b_judge = (sigma_b <= F);

    var seg1 = scanMaxAbs(function (xi) { return CASES.S5.delta1(xi, P1, P2, L, a, b, E, I); }, 0, a);
    var seg2 = scanMaxAbs(function (xi) { return CASES.S5.delta2(xi, P1, P2, L, a, b, E, I); }, a, a + c);
    var seg3 = scanMaxAbs(function (xi) { return CASES.S5.delta3(xi, P1, P2, L, a, b, E, I); }, a + c, L);
    var dm1 = excelRoundup(seg1.val, 2), dm2 = excelRoundup(seg2.val, 2), dm3 = excelRoundup(seg3.val, 2);
    var abss = [Math.abs(seg1.val), Math.abs(seg2.val), Math.abs(seg3.val)];
    var mxAbs = Math.max(abss[0], abss[1], abss[2]);
    var areaCHK = (mxAbs === abss[0]) ? 1 : ((mxAbs === abss[1]) ? 2 : 3);
    var deltaMax = [dm1, dm2, dm3][areaCHK - 1];
    var deltaMaxX = [seg1.x, seg2.x, seg3.x][areaCHK - 1];
    var segText = ['(x≦a)', '(a≦x≦L－b)', '(L－b≦x≦L)'][areaCHK - 1];
    var L_over_deltamax = (deltaMax !== 0) ? excelRounddown(L / deltaMax, 0) : '-';
    var deltaMax_judge = frexOn ? (Math.abs(deltaMax) <= L / FREX) : null;
    var CHK1 = sigma_b_judge && (frexOn ? deltaMax_judge : true);

    var hasX = xEnabled, xJudgeText = '-', xsctCHK = null;
    var Mx = null, sigma_bx = null, sigma_bx_judge = null,
        delta_x = null, L_over_deltax = null, delta_x_judge = null, CHK2 = null;
    if (hasX) {
      xsctCHK = (x <= a) ? 1 : ((x <= a + c) ? 2 : 3);
      xJudgeText = ['0≦x≦a', 'a≦x≦(L－b)', '(L－b)≦x≦L'][xsctCHK - 1];
      if (xsctCHK === 1) {
        Mx = excelRoundup((P1 * (L - a) + P2 * b) * x / L, 2);
        delta_x = excelRoundup(this.delta1(x, P1, P2, L, a, b, E, I), 2);
      } else if (xsctCHK === 2) {
        Mx = excelRoundup((P1 * a * (L - x) + P2 * b * x) / L, 2);
        delta_x = excelRoundup(this.delta2(x, P1, P2, L, a, b, E, I), 2);
      } else {
        Mx = excelRoundup((P1 * a + P2 * (L - b)) * (L - x) / L, 2);
        delta_x = excelRoundup(this.delta3(x, P1, P2, L, a, b, E, I), 2);
      }
      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);
      L_over_deltax = (delta_x !== 0) ? excelRounddown(L / delta_x, 0) : '-';
      delta_x_judge = frexOn ? (Math.abs(delta_x) <= L / FREX) : null;
      CHK2 = sigma_bx_judge && (frexOn ? delta_x_judge : true);
    }

    document.getElementById('titleSub').textContent = m.label + ' の強度計算';
    var r = { m:m, prtName:m.label, L:L, a:a, b:b, c:c, P1:P1, P2:P2, term:term, FREX:FREX, frexOn:frexOn, x:x,
      Z:Z, I:I, F:F, ZLabel:ZLabel, ILabel:ILabel, E:E,
      RA:RA, RB:RB, M1:M1, M2:M2, MmaxLabel:MmaxLabel, Mmax:Mmax, sigma_b:sigma_b, sigma_b_judge:sigma_b_judge,
      dm1:dm1, dm2:dm2, dm3:dm3, deltaMax:deltaMax, deltaMaxX:deltaMaxX, segText:segText,
      L_over_deltamax:L_over_deltamax, deltaMax_judge:deltaMax_judge, CHK1:CHK1,
      hasX:hasX, xJudgeText:xJudgeText, xsctCHK:xsctCHK, Mx:Mx, sigma_bx:sigma_bx, sigma_bx_judge:sigma_bx_judge,
      delta_x:delta_x, L_over_deltax:L_over_deltax, delta_x_judge:delta_x_judge, CHK2:CHK2 };
    document.getElementById('results').innerHTML = this.renderResults(r);
  },
  renderResults: function (r) {
    var p1Frac = (r.L > 0) ? Math.max(0, Math.min(1, r.a / r.L)) : 0.25;
    var p2Frac = (r.L > 0) ? Math.max(0, Math.min(1, (r.L - r.b) / r.L)) : 0.75;
    var xFrac = (r.L > 0 && r.hasX) ? Math.max(0, Math.min(1, r.x / r.L)) : null;
    var html = '';
    html += '<h2 class="bar">② ' + h(r.prtName) + ' の強度計算（反力・モーメント・たわみ）</h2><div class="sheet"><div class="cols">';
    html += '<div class="left">';
    html += '<div class="lead">支持長さL=' + fnum(r.L, 0) + 'mm　集中荷重P1=' + fnum(r.P1, 0) + 'N（位置a=' + fnum(r.a, 0) + 'mm）　P2=' + fnum(r.P2, 0) + 'N（位置L－b＝' + fnum(r.L - r.b, 0) + 'mm）</div>';
    html += '<div class="lead">' + r.ZLabel + '=' + fnum(r.Z) + 'mm³　' + r.ILabel + '=' + fnum(r.I) + 'mm⁴　E=' + fnum(r.E, 0) + 'N/mm²　F=' + fnum(r.F, 0) + 'N/mm²</div>';
    html += '<div class="diagram-wrap">' + beamTwoPointAsymDiagram({ p1Frac:p1Frac, p2Frac:p2Frac, xFrac:xFrac, segLabels:['a','c','b'] }) + '<div class="diagram-label">荷重モデル：単純梁 ／ 任意非対称二点集中荷重</div></div>';
    html += '<p class="expl">' + h(r.prtName) + 'にかかる荷重状態を上図の様な任意非対称二点集中荷重と想定する。</p>';
    html += '<div class="sub-head">反力RA，RB</div>';
    html += '<div class="calc-line">RA ＝ [P1(L－a)＋P2b]／L ＝ ' + fnum(r.RA) + 'N\nRB ＝ [P1a＋P2(L－b)]／L ＝ ' + fnum(r.RB) + 'N</div>';
    html += '<div class="sub-head">モーメントM1，M2，Mmax</div>';
    html += '<div class="calc-line">M1 ＝ RAa ＝ [P1(L－a)＋P2b]a／L ＝ ' + fnum(r.M1) + 'N・mm\nM2 ＝ RBb ＝ [P1a＋P2(L－b)]b／L ＝ ' + fnum(r.M2) + 'N・mm\nM1＝' + fnum(r.M1) + 'N・mm ' + (r.M1 >= r.M2 ? '≧' : '＜') + ' M2＝' + fnum(r.M2) + 'N・mm により\nMmax ＝ ' + r.MmaxLabel + ' ＝ ' + fnum(r.Mmax) + 'N・mm</div>';

  run: function () {

    var Iy = (mode==='list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var term = fval('term','短期'), FREX = Number(fval('FREX',200)), frexOn = fval('frexOn',false);
    var Z = (axis==='X') ? Zx : Zy, I = (axis==='X') ? Ix : Iy;

    var ZLabel = (axis==='X') ? 'Zx' : 'Zy', ILabel = (axis==='X') ? 'Ix' : 'Iy';

  syncVals: function () {
    var L=Number(fval('L',3000)), a=Number(fval('a',1500));
    var bEl=document.querySelector('[name="bval"]'); if(bEl) bEl.value=(L-a);
  },
  run: function () {
    this.syncVals();
    var preset=this.preset, mode=document.querySelector('input[name="memberMode"]:checked').value, m=readMember(preset);
    var Zx=(mode==='list')?preset.Zx:Number(fval('Zx',preset.Zx)), Zy=(mode==='list')?preset.Zy:Number(fval('Zy',preset.Zy));
    var Ix=(mode==='list')?preset.Ix:Number(fval('Ix',preset.Ix)), Iy=(mode==='list')?preset.Iy:Number(fval('Iy',preset.Iy));
    var axis=fval('axis','X'), L=Number(fval('L',3000)), a=Number(fval('a',1500)), w=Number(fval('w',5));
    var b=L-a, term=fval('term','短期'), FREX=Number(fval('FREX',200)), frexOn=fval('frexOn',false);
    var x=Number(fval('x',1000)), xEnabled=fval('xEnabled',false);
    var Z=(axis==='X')?Zx:Zy, I=(axis==='X')?Ix:Iy, F=(term==='短期')?m.F_short:m.F_long, E=m.E;
    var ZLabel=(axis==='X')?'Zx':'Zy', ILabel=(axis==='X')?'Ix':'Iy';
    var W=w*a;
    var RA=excelRoundup(W*(2*L-a)/(2*L),2), RB=excelRoundup(W*a/(2*L),2);
    // Mmax位置: x0=RA/w (0<=x0<=a)
    var x0=RA/w; x0=(x0>a)?a:x0;
    var Mmax=excelRoundup(RA*x0-w*x0*x0/2,2);
    var sigma_b=excelRoundup(Mmax/Z,2), sigma_b_judge=(sigma_b<=F);
    // たわみ（数値走査）
    var bestD=0;
    for(var xi=0;xi<=L;xi+=L/500){
      var di;
      if(xi<=a) di=RA*xi*(L*L-xi*xi)/(6*E*I*L)-w*xi*xi*(4*L*xi-xi*xi-6*L*L+4*L*a-a*a)/(24*E*I*L)*0; // simplified
      // 正確な公式: 0<=x<=a区間
      if(xi<=a) di=(RA/(6*E*I))*(xi*(L*L-xi*xi)/L)-(w/(24*E*I))*xi*(4*L*xi-xi*xi-6*L*L)*0;
      // 実用近似
      di=RA*xi*(L*L-xi*xi)/(6*E*I*L);
      if(xi<=a) di-=w*xi*xi*(3*a-xi)/(24*E*I);
      else di-=w*a*a*(3*xi-a)/(24*E*I);
      if(Math.abs(di)>Math.abs(bestD)) bestD=di;
    }
    var deltaMax=excelRoundup(bestD,2);
    var L_over_deltamax=(deltaMax!==0)?excelRounddown(L/deltaMax,0):'-';
    var deltaMax_judge=frexOn?(Math.abs(deltaMax)<=L/FREX):null;
    var thetaA=W*b*(2*L-a)/(6*E*I*L); var thetaA_rad=phpRound(thetaA,6), thetaA_deg=phpRound(rad2deg(thetaA),4);
    var CHK1=sigma_b_judge&&(frexOn?deltaMax_judge:true);
    var hasX=xEnabled, Mx=null, sigma_bx=null, sigma_bx_judge=null, delta_x=null, L_over_deltax=null, delta_x_judge=null, xJudgeText='-', xsctCHK=null, CHK2=null;

      else { Mx=excelRoundup(RB*(L-x),2); delta_x=excelRoundup(RB*(L-x)*(L*L-(L-x)*(L-x))/(6*E*I*L)-w*a*a*(3*x-a)/(24*E*I),2); }
      sigma_bx=excelRoundup(Mx/Z,2); sigma_bx_judge=(sigma_bx<=F);
      L_over_deltax=(delta_x!==0)?excelRounddown(L/delta_x,0):'-'; delta_x_judge=frexOn?(Math.abs(delta_x)<=L/FREX):null;
      CHK2=sigma_bx_judge&&(frexOn?delta_x_judge:true);
    }
    document.getElementById('titleSub').textContent=m.label+' の強度計算';
    var r={prtName:m.label,L:L,a:a,b:b,w:w,W:W,x0:x0,x:x,term:term,FREX:FREX,frexOn:frexOn,Z:Z,I:I,F:F,ZLabel:ZLabel,ILabel:ILabel,E:E,RA:RA,RB:RB,Mmax:Mmax,sigma_b:sigma_b,sigma_b_judge:sigma_b_judge,deltaMax:deltaMax,L_over_deltamax:L_over_deltamax,deltaMax_judge:deltaMax_judge,thetaA_rad:thetaA_rad,thetaA_deg:thetaA_deg,CHK1:CHK1,hasX:hasX,xsctCHK:xsctCHK,xJudgeText:xJudgeText,Mx:Mx,sigma_bx:sigma_bx,sigma_bx_judge:sigma_bx_judge,delta_x:delta_x,L_over_deltax:L_over_deltax,delta_x_judge:delta_x_judge,CHK2:CHK2};

  },
  run: function() {
    this.syncVals();
    var preset=this.preset, mode=document.querySelector('input[name="memberMode"]:checked').value, m=readMember(preset);
    var Zx=(mode==='list')?preset.Zx:Number(fval('Zx',preset.Zx)), Zy=(mode==='list')?preset.Zy:Number(fval('Zy',preset.Zy));
    var Ix=(mode==='list')?preset.Ix:Number(fval('Ix',preset.Ix)), Iy=(mode==='list')?preset.Iy:Number(fval('Iy',preset.Iy));
    var axis=fval('axis','X'), L=Number(fval('L',4000)), a=Number(fval('a',1000)), c=Number(fval('c',2000)), w=Number(fval('w',5));

  run:function(){

    var axis=fval('axis','X'), L=Number(fval('L',1500)), w=Number(fval('w',10));

    if(hasX){

      // Mx = w₀(L-x)²/(2L)*(L/3... 正確に)
      // 固定端からxまでの曲げモーメント: Mx = w₀*x²*(3L-2x)/(6L) はおかしい
      // 正確: wx(ξ)=w₀(L-ξ)/L、曲げはq(ξ)(x-ξ)
      // M(x) = ∫₀ˣ w₀(L-ξ)/L * (x-ξ) dξ = w₀/L * ∫₀ˣ (L-ξ)(x-ξ) dξ
      // = w₀/L * [Lxξ - (L+x)ξ²/2 + ξ³/3]₀ˣ = w₀/L * [Lx² - (L+x)x²/2 + x³/3]

  run:function(){
    var p=this.preset, mode=document.querySelector('input[name="memberMode"]:checked').value, m=readMember(p);
    var Zx=(mode==='list')?p.Zx:Number(fval('Zx',p.Zx)), Zy=(mode==='list')?p.Zy:Number(fval('Zy',p.Zy));
    var Ix=(mode==='list')?p.Ix:Number(fval('Ix',p.Ix)), Iy=(mode==='list')?p.Iy:Number(fval('Iy',p.Iy));
    var axis=fval('axis','X'), L=Number(fval('L',3000)), e=Number(fval('e',1000)), w=Number(fval('w',5));
    var term=fval('term','短期'), FREX=Number(fval('FREX',200)), frexOn=fval('frexOn',false);
    var Z=(axis==='X')?Zx:Zy, I=(axis==='X')?Ix:Iy, F=(term==='短期')?m.F_short:m.F_long, E=m.E;
    var ZLabel=(axis==='X')?'Zx':'Zy', ILabel=(axis==='X')?'Ix':'Iy';
    var Ltot=L+e;
    var RA=excelRoundup(w*Ltot*(L+2*e)/(2*L),2);
    var RB=excelRoundup(w*Ltot*(L-2*e)/(2*L)+w*e*e/L,2);
    // 修正: モーメントの釣り合いから
    // ΣMB=0: RA*L = w*(L+e)*(L+e)/2 - w*e^2/2...
    // 正確: 全体荷重の合力 W=w(L+e)、作用点 (L+e)/2
    // ΣMB=0 (AがA支点): RA*L = W*(L+e)/2 - e*W... うーん複雑
    // はね出し梁: A(左端x=0)、B(右端x=L)、はね出し部B〜(L+e)
    // ΣMA=0: RB*L = w*(L+e)^2/2 → RB = w(L+e)^2/(2L)
    RB=excelRoundup(w*Ltot*Ltot/(2*L),2);
    RA=excelRoundup(w*Ltot-RB,2);
    var MB=excelRoundup(w*e*e/2,2);
    // スパン内Mmax: x=RA/w で
    var xMspan=RA/w;
    var Mspan=excelRoundup(RA*xMspan-w*xMspan*xMspan/2,2);
    var Mmax=excelRoundup(Math.max(MB,Math.abs(Mspan)),2);
    var sigma_b=excelRoundup(Mmax/Z,2), sigma_b_judge=(sigma_b<=F);
    var deltaMax=excelRoundup(5*w*Math.pow(L,4)/(384*E*I),2);

    var deltaMax_judge=frexOn?(Math.abs(deltaMax)<=L/FREX):null;
    var thetaB=w*e*(L*L+2*L*e+e*e/2)/(6*E*I*L); var thetaB_rad=phpRound(thetaB,6), thetaB_deg=phpRound(rad2deg(thetaB),4);
    var CHK1=sigma_b_judge&&(frexOn?deltaMax_judge:true);
    document.getElementById('titleSub').textContent=m.label+' の強度計算';
    var r={prtName:m.label,L:L,e:e,w:w,Ltot:Ltot,xMspan:xMspan,term:term,FREX:FREX,frexOn:frexOn,Z:Z,I:I,F:F,ZLabel:ZLabel,ILabel:ILabel,E:E,RA:RA,RB:RB,MB:MB,Mspan:Mspan,Mmax:Mmax,sigma_b:sigma_b,sigma_b_judge:sigma_b_judge,deltaMax:deltaMax,L_over_deltamax:L_over_deltamax,deltaMax_judge:deltaMax_judge,thetaB_rad:thetaB_rad,thetaB_deg:thetaB_deg,CHK1:CHK1};
    document.getElementById('results').innerHTML=this.renderResults(r);
  },
  renderResults:function(r){
    var html='';
    html+='<h2 class="bar">② '+h(r.prtName)+' の強度計算</h2><div class="sheet"><div class="cols"><div class="left">';

      '<div class="rowline"><span class="lbl">断面形状</span><span><select name="secType" onchange="CASES.B1.updateFields()">'+
        '<option value="rect">矩形（中実）</option>'+
        '<option value="hollow">矩形（中空）</option>'+
        '<option value="circle">円形（中実）</option>'+

  },
  updateFields:function(){
    var t=document.querySelector('select[name="secType"]').value;
    var html='';
    if(t==='rect') html='<div class="rowline"><span class="lbl">幅 B</span><span><input type="number" step="any" name="secB" value="100"> <small>mm</small></span></div><div class="rowline"><span class="lbl">高さ H</span><span><input type="number" step="any" name="secH" value="200"> <small>mm</small></span></div>';
    else if(t==='hollow') html='<div class="rowline"><span class="lbl">外幅 B</span><span><input type="number" step="any" name="secB" value="100"> <small>mm</small></span></div><div class="rowline"><span class="lbl">外高さ H</span><span><input type="number" step="any" name="secH" value="200"> <small>mm</small></span></div><div class="rowline"><span class="lbl">板厚 t</span><span><input type="number" step="any" name="sect" value="6"> <small>mm</small></span></div>';
    else if(t==='circle') html='<div class="rowline"><span class="lbl">径 D</span><span><input type="number" step="any" name="secD" value="100"> <small>mm</small></span></div>';
    else if(t==='pipe') html='<div class="rowline"><span class="lbl">外径 D</span><span><input type="number" step="any" name="secD" value="100"> <small>mm</small></span></div><div class="rowline"><span class="lbl">板厚 t</span><span><input type="number" step="any" name="sect" value="6"> <small>mm</small></span></div>';
    else if(t==='htype') html='<div class="rowline"><span class="lbl">フランジ幅 B</span><span><input type="number" step="any" name="secB" value="100"> <small>mm</small></span></div><div class="rowline"><span class="lbl">梁せい H</span><span><input type="number" step="any" name="secH" value="200"> <small>mm</small></span></div><div class="rowline"><span class="lbl">ウェブ板厚 tw</span><span><input type="number" step="any" name="sectw" value="6"> <small>mm</small></span></div><div class="rowline"><span class="lbl">フランジ板厚 tf</span><span><input type="number" step="any" name="sectf" value="9"> <small>mm</small></span></div>';
    document.getElementById('secFields').innerHTML=html;
    this.run();
  },
  run:function(){
    var t=document.querySelector('select[name="secType"]').value;
    var A,Ix,Iy,Zx,Zy,ip,Zp,name;
    if(t==='rect'){
      var B=Number(fval('secB',100)),H=Number(fval('secH',200));
      A=B*H; Ix=B*H*H*H/12; Iy=H*B*B*B/12; Zx=Ix/(H/2); Zy=Iy/(B/2);
      ip=Math.sqrt((Ix+Iy)/A); Zp=0; name='矩形（中実） B×H＝'+B+'×'+H+'mm';
    } else if(t==='hollow'){
      var B=Number(fval('secB',100)),H=Number(fval('secH',200)),tt=Number(fval('sect',6));
      var bi=B-2*tt, hi=H-2*tt;
      A=B*H-bi*hi; Ix=(B*H*H*H-bi*hi*hi*hi)/12; Iy=(H*B*B*B-hi*bi*bi*bi)/12;
      Zx=Ix/(H/2); Zy=Iy/(B/2); ip=Math.sqrt((Ix+Iy)/A); Zp=0;
      name='矩形（中空） B×H×t＝'+B+'×'+H+'×'+tt+'mm';
    } else if(t==='circle'){
      var D=Number(fval('secD',100));
      A=Math.PI*D*D/4; Ix=Math.PI*D*D*D*D/64; Iy=Ix; Zx=Math.PI*D*D*D/32; Zy=Zx;
      ip=D/4; var Ip=Math.PI*D*D*D*D/32; Zp=Ip/(D/2);
      name='円形（中実） D＝'+D+'mm';
    } else if(t==='pipe'){
      var D=Number(fval('secD',100)),tt=Number(fval('sect',6));
      var di=D-2*tt;
      A=Math.PI*(D*D-di*di)/4; Ix=Math.PI*(D*D*D*D-di*di*di*di)/64; Iy=Ix;
      Zx=Ix/(D/2); Zy=Zx; ip=Math.sqrt(Ix/A); var Ip=2*Ix; Zp=Ip/(D/2);
      name='円筒（パイプ） D×t＝'+D+'×'+tt+'mm';
    } else if(t==='htype'){
      var B=Number(fval('secB',100)),H=Number(fval('secH',200)),tw=Number(fval('sectw',6)),tf=Number(fval('sectf',9));
      var hw=H-2*tf;
      A=2*B*tf+hw*tw; Ix=(B*H*H*H-(B-tw)*hw*hw*hw)/12; Iy=(2*tf*B*B*B+hw*tw*tw*tw)/12;
      Zx=Ix/(H/2); Zy=Iy/(B/2); ip=Math.sqrt(Ix/A);
      name='H形断面 B×H×tw×tf＝'+B+'×'+H+'×'+tw+'×'+tf+'mm';
    }
    A=excelRoundup(A,2); Ix=excelRoundup(Ix,2); Iy=excelRoundup(Iy,2);
    Zx=excelRoundup(Zx,2); Zy=excelRoundup(Zy,2); ip=excelRoundup(ip,3);
    var html='<h2 class="bar">② 断面諸量計算結果</h2><div class="sheet"><div class="cols"><div class="left">';
    html+='<div class="lead">断面形状：'+name+'</div>';
    html+='<div class="sub-head">断面積 A</div>';
    html+='<div class="calc-line">A ＝ '+fnum(A)+'mm²</div>';
    html+='<div class="sub-head">断面二次モーメント Ix，Iy</div>';
    html+='<div class="calc-line">Ix ＝ '+fnum(Ix)+'mm⁴\nIy ＝ '+fnum(Iy)+'mm⁴</div>';
    html+='<div class="sub-head">断面係数 Zx，Zy</div>';
    html+='<div class="calc-line">Zx ＝ Ix／(H/2) ＝ '+fnum(Zx)+'mm³\nZy ＝ Iy／(B/2) ＝ '+fnum(Zy)+'mm³</div>';
    html+='<div class="sub-head">断面二次半径 ip</div>';
    html+='<div class="calc-line">ip ＝ √(Ix/A) ＝ '+fnum(ip)+'mm</div>';
    html+='</div><div class="right">';
    html+='<div class="panel-title">断面諸量</div>';
    html+='<div class="rowline"><span class="lbl">A</span><span class="val">'+fnum(A)+' <small>mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Ix</span><span class="val">'+fnum(Ix)+' <small>mm⁴</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Iy</span><span class="val">'+fnum(Iy)+' <small>mm⁴</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Zx</span><span class="val">'+fnum(Zx)+' <small>mm³</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Zy</span><span class="val">'+fnum(Zy)+' <small>mm³</small></span></div>';
    html+='<div class="rowline"><span class="lbl">ip</span><span class="val">'+fnum(ip)+' <small>mm</small></span></div>';
    html+='</div></div></div>';
    html+='<h2 class="bar">③ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    if(t==='rect'||t==='hollow'){
      html+='<div class="formula-ref"><span>Ix ＝ BH³／12　（中空: 外－内）</span></div>';
      html+='<div class="formula-ref"><span>Zx ＝ Ix／(H/2)</span></div>';

      html+='<div class="formula-ref"><span>Zx ＝ πD³／32</span></div>';
    } else {
      html+='<div class="formula-ref"><span>Ix ＝ [BH³－(B-tw)hw³]／12</span></div>';
      html+='<div class="formula-ref"><span>Iy ＝ [2tf B³＋hw tw³]／12</span></div>';
    }
    html+='</div><div>';
    html+='<div class="formula-ref"><span>A ＝ 断面積（形状による）</span></div>';
    html+='<div class="formula-ref"><span>ip ＝ √(Ix/A)</span></div>';
    html+='</div></div></div>';
    document.getElementById('results').innerHTML=html;
  }
};

CASES.BR1={

  mount:function(main){
    var p=this.preset;
    main.innerHTML='<h1 class="pageTitle">【ブラケット強度計算】<span class="sub" id="titleSub">ブラケットの強度計算</span></h1>'+
      '<form id="calcForm" onsubmit="return false;"><h2 class="bar">① 設定値入力</h2>'+
      '<div class="sheet">'+
      '<div class="rowline"><span class="lbl">ブラケット長さ e</span><span><input type="number" step="any" name="ebr" value="100"> <small>mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">ブラケット高さ h</span><span><input type="number" step="any" name="hbr" value="150"> <small>mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">プレート厚さ t</span><span><input type="number" step="any" name="tbr" value="9"> <small>mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">荷重 P</span><span><input type="number" step="any" name="Pbr" value="3000"> <small>N</small></span></div>'+
      '<div class="rowline"><span class="lbl">許容曲げ応力度 F</span><span><input type="number" step="any" name="Fbr" value="235"> <small>N/mm²</small></span></div>'+

      '<div class="btnbar"><button type="button" class="btn" onclick="CASES.BR1.run()">計 算 す る</button></div>'+
      '</div></form><div id="results"></div>'+
      '<div class="note">※ この頁は元Excelの「BR1」シートに対応します。片持ちプレート（ブラケット）の曲げ応力・せん断応力・等価応力を同時に検討します。</div>';

  },
  run:function(){
    var e=Number(fval('ebr',100)), h=Number(fval('hbr',150)), t=Number(fval('tbr',9));
    var P=Number(fval('Pbr',3000)), F=Number(fval('Fbr',235)), term=fval('term','短期');
    var Fs=excelRoundup(F/Math.sqrt(3),2);
    var A=excelRoundup(t*h,2);
    var Z=excelRoundup(t*h*h/6,2);
    var M=excelRoundup(P*e,2);
    var sigma_b=excelRoundup(M/Z,2), sigma_b_j=(sigma_b<=F);
    var tau=excelRoundup(P/A,2), tau_j=(tau<=Fs);
    var sigma_eq=excelRoundup(Math.sqrt(sigma_b*sigma_b+3*tau*tau),2);
    var eq_j=(sigma_eq<=F);
    var CHK1=sigma_b_j&&tau_j&&eq_j;
    var html='<h2 class="bar">② ブラケット強度計算</h2><div class="sheet"><div class="cols"><div class="left">';
    html+='<div class="lead">P='+fnum(P,0)+'N　e='+fnum(e,0)+'mm（偏心距離）　h='+fnum(h,0)+'mm　t='+fnum(t,0)+'mm</div>';

    html+='<div class="sub-head">断面積 A・断面係数 Z</div>';
    html+='<div class="calc-line">A ＝ t×h ＝ '+fnum(t,0)+'mm×'+fnum(h,0)+'mm ＝ '+fnum(A)+'mm²\nZ ＝ t×h²／6 ＝ '+fnum(t,0)+'mm×('+fnum(h,0)+'mm)²／6 ＝ '+fnum(Z)+'mm³</div>';
    html+='<div class="sub-head">曲げモーメント M</div>';
    html+='<div class="calc-line">M ＝ Pe ＝ '+fnum(P,0)+'N×'+fnum(e,0)+'mm ＝ '+fnum(M)+'N・mm</div>';
    html+='<div class="sub-head">曲げ応力度 σb</div>';
    html+='<div class="calc-line">σb ＝ M／Z ＝ '+fnum(M)+'N・mm ÷ '+fnum(Z)+'mm³ ＝ '+fnum(sigma_b)+'N/mm² '+cmp(sigma_b_j)+' F＝'+fnum(F,0)+'N/mm²　'+(sigma_b_j?'OK':'NG')+'</div>';
    html+='<div class="sub-head">せん断応力度 τ</div>';
    html+='<div class="calc-line">τ ＝ P／A ＝ '+fnum(P,0)+'N ÷ '+fnum(A)+'mm² ＝ '+fnum(tau)+'N/mm² '+cmp(tau_j)+' Fs＝'+fnum(Fs)+'N/mm²　'+(tau_j?'OK':'NG')+'</div>';
    html+='<div class="sub-head">等価応力度 σeq（組み合わせ応力）</div>';
    html+='<div class="calc-line">σeq ＝ √(σb²＋3τ²) ＝ √('+fnum(sigma_b)+'²＋3×'+fnum(tau)+'²) ＝ √('+fnum(sigma_b*sigma_b)+'+'+fnum(3*tau*tau)+') ＝ '+fnum(sigma_eq)+'N/mm² '+cmp(eq_j)+' F＝'+fnum(F,0)+'N/mm²　'+(eq_j?'OK':'NG')+'</div>';
    html+='<div class="final '+(CHK1?'final-ok':'final-ng')+'">以上計算より、ブラケットは強度上問題'+(CHK1?'無い。':'有り、要再検討！')+'</div>';
    html+='</div><div class="right">';
    html+='<div class="panel-title">計算結果</div>';
    html+='<div class="rowline"><span class="lbl">A</span><span class="val">'+fnum(A)+' <small>mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Z</span><span class="val">'+fnum(Z)+' <small>mm³</small></span></div>';
    html+='<div class="rowline"><span class="lbl">M</span><span class="val">'+fnum(M)+' <small>N・mm</small></span></div>';
    html+='<div class="rowline"><span class="lbl">σb</span><span class="val">'+fnum(sigma_b)+' <small>N/mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">σb判定</span><span class="val">'+cmp(sigma_b_j)+' '+badge(sigma_b_j)+'</span></div>';
    html+='<div class="rowline"><span class="lbl">τ</span><span class="val">'+fnum(tau)+' <small>N/mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">τ判定</span><span class="val">'+cmp(tau_j)+' '+badge(tau_j)+'</span></div>';
    html+='<div class="rowline"><span class="lbl">σeq</span><span class="val">'+fnum(sigma_eq)+' <small>N/mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">σeq判定</span><span class="val">'+cmp(eq_j)+' '+badge(eq_j)+'</span></div>';

    html+='</div></div></div>';
    html+='<h2 class="bar">③ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html+='<div class="formula-ref"><span>M ＝ Pe</span></div>';

    html+='<div class="formula-ref"><span>τ ＝ P／A ＝ P／(th)</span></div>';
    html+='</div><div>';
    html+='<div class="formula-ref"><span>σeq ＝ √(σb²＋3τ²) ≦ F</span></div>';
    html+='<div class="formula-ref"><span>Fs ＝ F／√3</span></div>';
    html+='</div></div></div>';
    document.getElementById('results').innerHTML=html;
  }
};

function makeFlatPlate(id, title, noteText, kVal, alphaVal){
  CASES[id]={
    preset:{},
    mount:function(main){
      main.innerHTML='<h1 class="pageTitle">【'+title+'】<span class="sub">平板（矩形板）の強度計算</span></h1>'+

        '<div class="rowline"><span class="lbl">ヤング率 E</span><span><input type="number" step="any" name="fpE" value="205000"> <small>N/mm²</small></span></div>'+
        '<div class="rowline"><span class="lbl">ポアソン比 ν</span><span><input type="number" step="any" name="fpnu" value="0.3"></span></div>'+
        '<div class="rowline"><span class="lbl">許容応力度 F</span><span><input type="number" step="any" name="fpF" value="205"> <small>N/mm²</small></span></div>'+
        '</div><div class="btnbar"><button type="button" class="btn" onclick="CASES[\''+id+'\'].run()">計 算 す る</button></div></div></form>'+
        '<div id="results"></div>'+
        '<div class="note">'+noteText+'</div>';
    },
    run:function(){
      var a=Number(fval('fpa',500)), b=Number(fval('fpb',300)), t=Number(fval('fpt',6));
      var q=Number(fval('fpq',0.1)), E2=Number(fval('fpE',205000)), nu=Number(fval('fpnu',0.3)), F2=Number(fval('fpF',205));
      var D=excelRoundup(E2*t*t*t/(12*(1-nu*nu)),2);
      var sigma_max=excelRoundup(kVal*q*b*b/(t*t),2);
      var judge_s=(sigma_max<=F2);
      var delta_max=excelRoundup(alphaVal*q*Math.pow(b,4)/(E2*t*t*t),2);

      html+='<div class="sub-head">曲げ剛性 D</div>';
      html+='<div class="calc-line">D ＝ Et³／[12(1－ν²)] ＝ '+fnum(E2,0)+'N/mm²×('+fnum(t,0)+'mm)³／[12×(1－'+fnum(nu,2)+'²)] ＝ '+fnum(D)+'N・mm</div>';
      html+='<div class="sub-head">最大応力度 σmax（k='+fnum(kVal,4)+'）</div>';
      html+='<div class="calc-line">σmax ＝ k×q×b²／t²\n　＝ '+fnum(kVal,4)+'×'+fnum(q,4)+'N/mm²×('+fnum(b,0)+'mm)²／('+fnum(t,0)+'mm)²\n　＝ '+fnum(sigma_max)+'N/mm² '+cmp(judge_s)+' '+fnum(F2,0)+'N/mm²　'+(judge_s?'OK':'NG')+'</div>';
      html+='<div class="sub-head">最大たわみ δmax（α='+fnum(alphaVal,4)+'）</div>';
      html+='<div class="calc-line">δmax ＝ α×q×b⁴／(Et³)\n　＝ '+fnum(alphaVal,4)+'×'+fnum(q,4)+'N/mm²×('+fnum(b,0)+'mm)⁴／('+fnum(E2,0)+'N/mm²×('+fnum(t,0)+'mm)³)\n　＝ '+fnum(delta_max)+'mm　（b/δ ＝ '+Lov+'）</div>';

      html+='<div class="panel-title">計算結果</div>';
      html+='<div class="rowline"><span class="lbl">D</span><span class="val">'+fnum(D)+' <small>N・mm</small></span></div>';
      html+='<div class="rowline"><span class="lbl">σmax</span><span class="val">'+fnum(sigma_max)+' <small>N/mm²</small></span></div>';

      html+='<h2 class="bar">③ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
      html+='<div class="formula-ref"><span>D ＝ Et³／[12(1－ν²)]</span></div>';
      html+='<div class="formula-ref"><span>σmax ＝ k×q×b²／t²　（k＝'+fnum(kVal,4)+'）</span></div>';
      html+='</div><div>';
      html+='<div class="formula-ref"><span>δmax ＝ α×qb⁴／(Et³)　（α＝'+fnum(alphaVal,4)+'）</span></div>';
      html+='</div></div></div>';
      document.getElementById('results').innerHTML=html;
    }
  };
}

makeFlatPlate('FP6','平板【一辺固定・一辺自由・二辺単純】','※ この頁は元Excelの「FP6」シートに対応します。一辺固定・一辺自由・二辺単純の矩形板に等分布荷重qが作用するモデルです（k=0.3500、α=0.0350）。',0.3500,0.0350);

/* ====================================================================
 * T1: ねじり計算
 * ==================================================================== */
CASES.T1={
  preset:{},
  mount:function(main){
    main.innerHTML='<h1 class="pageTitle">【ねじり計算】<span class="sub">円形断面のねじり強度・ねじり角</span></h1>'+
      '<form id="calcForm" onsubmit="return false;"><h2 class="bar">① 設定値入力</h2>'+
      '<div class="sheet"><div id="caseFields">'+
      '<div class="rowline"><span class="lbl">断面形状</span><span><select name="ttype"><option value="solid" selected>中実円形</option><option value="pipe">円筒（パイプ）</option></select></span></div>'+
      '<div class="rowline"><span class="lbl">外径 D</span><span><input type="number" step="any" name="tD" value="50"> <small>mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">肉厚 t（パイプのみ）</span><span><input type="number" step="any" name="tt" value="5"> <small>mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">ねじりモーメント T</span><span><input type="number" step="any" name="tT" value="100000"> <small>N・mm</small></span></div>'+
      '<div class="rowline"><span class="lbl">許容せん断応力度 fs</span><span><input type="number" step="any" name="tfs" value="118"> <small>N/mm²</small></span></div>'+
      '<div class="rowline"><span class="lbl">ヤング率 E</span><span><input type="number" step="any" name="tE" value="205000"> <small>N/mm²</small></span></div>'+
      '<div class="rowline"><span class="lbl">ポアソン比 ν</span><span><input type="number" step="any" name="tnu" value="0.3"></span></div>'+
      '<div class="rowline"><span class="lbl">部材長さ L</span><span><input type="number" step="any" name="tL" value="500"> <small>mm</small></span></div>'+
      '</div><div class="btnbar"><button type="button" class="btn" onclick="CASES.T1.run()">計 算 す る</button></div></div></form>'+
      '<div id="results"></div>'+
      '<div class="note">※ この頁は元Excelの「T1」シートに対応します。円形断面（中実・パイプ）のねじり応力度とねじり角を計算します。</div>';
  },
  run:function(){
    var ttype=document.querySelector('select[name="ttype"]').value;
    var D=Number(fval('tD',50)), tt=Number(fval('tt',5)), T=Number(fval('tT',100000));
    var fs=Number(fval('tfs',118)), E2=Number(fval('tE',205000)), nu=Number(fval('tnu',0.3)), L=Number(fval('tL',500));
    var G=excelRoundup(E2/(2*(1+nu)),0);
    var Ip, Zp, name;
    if(ttype==='solid'){
      Ip=excelRoundup(Math.PI*D*D*D*D/32,2);
      Zp=excelRoundup(Math.PI*D*D*D/16,2);
      name='中実円形 D＝'+D+'mm';
    } else {
      var di=D-2*tt;
      Ip=excelRoundup(Math.PI*(D*D*D*D-di*di*di*di)/32,2);
      Zp=excelRoundup(Ip/(D/2),2);
      name='円筒（パイプ） D×t＝'+D+'×'+tt+'mm';
    }
    var tau=excelRoundup(T/Zp,2), judge=(tau<=fs);
    var theta_rad=excelRoundup(T*L/(G*Ip),6);
    var theta_deg=excelRoundup(theta_rad*180/Math.PI,4);
    var html='<h2 class="bar">② ねじり計算結果</h2><div class="sheet"><div class="cols"><div class="left">';
    html+='<div class="lead">'+name+'　T='+fnum(T,0)+'N・mm　L='+fnum(L,0)+'mm</div>';
    html+='<div class="lead">G='+fnum(G,0)+'N/mm²　fs='+fnum(fs,0)+'N/mm²</div>';
    html+='<p class="expl">'+name+'にねじりモーメントT='+fnum(T,0)+'N・mmが作用する場合のねじり応力度とねじり角を検討する。</p>';
    html+='<div class="sub-head">ねじりモーメントT</div>';
    html+='<div class="note-line">T ＝ -----※ねじりモーメントTの計算を検討条件に合わせて記述-----</div><div class="calc-line">　＝ '+fnum(T,0)+'N・mm</div>';
    html+='<div class="sub-head">せん断弾性係数 G</div>';
    html+='<div class="calc-line">G ＝ E／[2(1＋ν)] ＝ '+fnum(E2,0)+'N/mm²／[2×(1＋'+fnum(nu,2)+')] ＝ '+fnum(G,0)+'N/mm²</div>';
    html+='<div class="sub-head">断面二次極モーメント Ip・極断面係数 Zp</div>';
    if(ttype==='solid'){
      html+='<div class="calc-line">Ip ＝ πD⁴／32 ＝ π×('+fnum(D,0)+'mm)⁴／32 ＝ '+fnum(Ip)+'mm⁴\nZp ＝ πD³／16 ＝ π×('+fnum(D,0)+'mm)³／16 ＝ '+fnum(Zp)+'mm³</div>';
    } else {
      html+='<div class="calc-line">Ip ＝ π(D⁴－di⁴)／32 ＝ '+fnum(Ip)+'mm⁴\nZp ＝ Ip/(D/2) ＝ '+fnum(Zp)+'mm³</div>';
    }
    html+='<div class="sub-head">ねじり応力度 τ</div>';
    html+='<div class="calc-line">τ ＝ T／Zp ＝ '+fnum(T,0)+'N・mm ÷ '+fnum(Zp)+'mm³ ＝ '+fnum(tau)+'N/mm² '+cmp(judge)+' fs＝'+fnum(fs,0)+'N/mm²　'+(judge?'OK':'NG')+'</div>';
    html+='<div class="sub-head">ねじり角 θ</div>';
    html+='<div class="calc-line">θ ＝ TL／(GIp) ＝ '+fnum(T,0)+'N・mm×'+fnum(L,0)+'mm ÷ ('+fnum(G,0)+'N/mm²×'+fnum(Ip)+'mm⁴) ＝ '+fnum(theta_rad,6)+'rad ('+fnum(theta_deg,4)+'°)</div>';
    html+='<div class="final '+(judge?'final-ok':'final-ng')+'">以上計算より、ねじり強度上問題'+(judge?'無い。':'有り、要再検討！')+'</div>';
    html+='</div><div class="right">';
    html+='<div class="panel-title">計算結果</div>';
    html+='<div class="rowline"><span class="lbl">G</span><span class="val">'+fnum(G,0)+' <small>N/mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Ip</span><span class="val">'+fnum(Ip)+' <small>mm⁴</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Zp</span><span class="val">'+fnum(Zp)+' <small>mm³</small></span></div>';
    html+='<div class="rowline"><span class="lbl">τ</span><span class="val">'+fnum(tau)+' <small>N/mm²</small></span></div>';
    html+='<div class="rowline"><span class="lbl">τ判定</span><span class="val">'+cmp(judge)+' '+badge(judge)+'</span></div>';
    html+='<div class="rowline"><span class="lbl">θ</span><span class="val">'+fnum(theta_rad,6)+' <small>rad</small></span></div>';
    html+='<div class="rowline"><span class="lbl">&nbsp;</span><span class="val">'+fnum(theta_deg,4)+' <small>°</small></span></div>';
    html+='</div></div></div>';
    html+='<h2 class="bar">③ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html+='<div class="formula-ref"><span>G ＝ E／[2(1＋ν)]</span></div>';
    html+='<div class="formula-ref"><span>Ip ＝ πD⁴／32（中実）</span></div>';
    html+='<div class="formula-ref"><span>Zp ＝ Ip／(D/2)</span></div>';
    html+='</div><div>';
    html+='<div class="formula-ref"><span>τ ＝ T／Zp ≦ fs</span></div>';
    html+='<div class="formula-ref"><span>θ ＝ TL／(GIp)</span></div>';
    html+='</div></div></div>';
    document.getElementById('results').innerHTML=html;
  }
};

/* ====================================================================
 * WD: 重量・重心計算
 * ==================================================================== */
CASES.WD={
  preset:{},
  itemCount:3,
  mount:function(main){
    this.itemCount=3;
    main.innerHTML='<h1 class="pageTitle">【重量・重心計算】<span class="sub">部材リストの合計重量・重心座標を計算</span></h1>'+
      '<form id="calcForm" onsubmit="return false;"><h2 class="bar">① 部材データ入力</h2>'+
      '<div class="sheet"><div id="caseFields">'+
      '<div id="wdList"></div>'+
      '<div class="btnbar">'+
      '<button type="button" class="btn" onclick="CASES.WD.addItem()">＋ 部材追加</button>'+
      ' <button type="button" class="btn" onclick="CASES.WD.run()">計 算 す る</button>'+
      '</div></div></div></form><div id="results"></div>'+
      '<div class="note">※ この頁は元Excelの「WD」シートに対応します。各部材の重量と重心座標を入力して合計重量・重心を計算します。</div>';
    var list=document.getElementById('wdList');
    list.innerHTML='';
    for(var i=0;i<this.itemCount;i++) this._appendRow(i);
    this.run();
  },
  _appendRow:function(idx){
    var list=document.getElementById('wdList');
    var row=document.createElement('div');
    row.className='rowline'; row.style.flexWrap='wrap'; row.style.gap='4px';
    row.innerHTML=
      '<span class="lbl" style="min-width:60px">部材'+(idx+1)+'</span>'+
      '<input type="text" name="wdname_'+idx+'" placeholder="名称" value="部材'+(idx+1)+'" style="width:80px">'+
      '<input type="number" step="any" name="wdw_'+idx+'" placeholder="重量(N)" value="'+(1000*(idx+1))+'" style="width:90px"> <small>N</small>'+
      '<input type="number" step="any" name="wdx_'+idx+'" placeholder="X重心(mm)" value="'+(100*(idx+1))+'" style="width:90px"> <small>X mm</small>'+
      '<input type="number" step="any" name="wdy_'+idx+'" placeholder="Y重心(mm)" value="'+(50*(idx+1))+'" style="width:90px"> <small>Y mm</small>'+
      '<input type="number" step="any" name="wdz_'+idx+'" placeholder="Z重心(mm)" value="0" style="width:80px"> <small>Z mm</small>';
    list.appendChild(row);
  },
  addItem:function(){
    this._appendRow(this.itemCount);
    this.itemCount++;
  },
  run:function(){
    var n=this.itemCount;
    var Wtotal=0, WXtotal=0, WYtotal=0, WZtotal=0;
    var tableRows='';
    for(var i=0;i<n;i++){
      var nm=fval('wdname_'+i,'部材'+(i+1));
      var wi=Number(fval('wdw_'+i,0));
      var xi=Number(fval('wdx_'+i,0));
      var yi=Number(fval('wdy_'+i,0));
      var zi=Number(fval('wdz_'+i,0));
      Wtotal+=wi; WXtotal+=wi*xi; WYtotal+=wi*yi; WZtotal+=wi*zi;
      tableRows+='<div class="rowline"><span class="lbl">'+h(nm)+'</span><span>W='+fnum(wi,0)+'N　X='+fnum(xi,0)+'mm　Y='+fnum(yi,0)+'mm　Z='+fnum(zi,0)+'mm　ΣWX='+fnum(wi*xi,0)+'　ΣWY='+fnum(wi*yi,0)+'　ΣWZ='+fnum(wi*zi,0)+'</span></div>';
    }
    Wtotal=excelRoundup(Wtotal,2);
    var Xg=excelRoundup(WXtotal/Wtotal,2), Yg=excelRoundup(WYtotal/Wtotal,2), Zg=excelRoundup(WZtotal/Wtotal,2);
    var html='<h2 class="bar">② 重量・重心計算結果</h2><div class="sheet">';
    html+='<div class="sub-head">部材リスト</div>';
    html+=tableRows;
    html+='<div class="sub-head" style="margin-top:12px">合計重量 W</div>';
    html+='<div class="calc-line">W ＝ ΣWi ＝ '+fnum(Wtotal,0)+' N</div>';
    html+='<div class="sub-head">重心X座標 Xg</div>';
    html+='<div class="calc-line">Xg ＝ ΣWiXi／ΣWi ＝ '+fnum(WXtotal,0)+'N・mm ÷ '+fnum(Wtotal,0)+'N ＝ '+fnum(Xg)+' mm</div>';
    html+='<div class="sub-head">重心Y座標 Yg</div>';
    html+='<div class="calc-line">Yg ＝ ΣWiYi／ΣWi ＝ '+fnum(WYtotal,0)+'N・mm ÷ '+fnum(Wtotal,0)+'N ＝ '+fnum(Yg)+' mm</div>';
    html+='<div class="sub-head">重心Z座標 Zg</div>';
    html+='<div class="calc-line">Zg ＝ ΣWiZi／ΣWi ＝ '+fnum(WZtotal,0)+'N・mm ÷ '+fnum(Wtotal,0)+'N ＝ '+fnum(Zg)+' mm</div>';
    html+='</div>';
    html+='<h2 class="bar">計算結果まとめ</h2><div class="sheet"><div class="cols"><div class="left">';
    html+='<div class="sub-head">まとめ</div>';
    html+='<div class="calc-line">合計重量 W ＝ '+fnum(Wtotal,0)+' N\n重心 Xg ＝ '+fnum(Xg)+' mm\n重心 Yg ＝ '+fnum(Yg)+' mm\n重心 Zg ＝ '+fnum(Zg)+' mm</div>';
    html+='</div><div class="right">';
    html+='<div class="panel-title">計算結果</div>';
    html+='<div class="rowline"><span class="lbl">W（合計重量）</span><span class="val">'+fnum(Wtotal,0)+' <small>N</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Xg</span><span class="val">'+fnum(Xg)+' <small>mm</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Yg</span><span class="val">'+fnum(Yg)+' <small>mm</small></span></div>';
    html+='<div class="rowline"><span class="lbl">Zg</span><span class="val">'+fnum(Zg)+' <small>mm</small></span></div>';
    html+='</div></div></div>';
    html+='<h2 class="bar">③ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html+='<div class="formula-ref"><span>W ＝ ΣWi</span></div>';
    html+='<div class="formula-ref"><span>Xg ＝ ΣWiXi／ΣWi</span></div>';
    html+='</div><div>';
    html+='<div class="formula-ref"><span>Yg ＝ ΣWiYi／ΣWi</span></div>';
    html+='<div class="formula-ref"><span>Zg ＝ ΣWiZi／ΣWi</span></div>';
    html+='</div></div></div>';
    document.getElementById('results').innerHTML=html;
  }
};

</script>
</body>
</html>
