<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強度計算kit（Web版）</title>
<style>
  :root{
    --navy:#1f3a5f; --navy-d:#16293f; --accent:#2b6cb0;
    --ok:#2f855a; --ng:#c53030; --bg:#eef1f5; --line:#d7dee6; --panelbg:#fbfcfe;
    --side-w:290px;
  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);margin:0;padding:0;color:#25313d;}

  /* ---------- 全体レイアウト ---------- */
  .topbar{background:var(--navy-d);color:#fff;padding:12px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;}
  .topbar h1 .ver{font-size:11px;font-weight:400;color:#9fb3ca;margin-left:6px;}
  .topbar .crumb{font-size:12.5px;color:#cfe0f2;}
  .layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto;}
  .side{width:var(--side-w);flex:0 0 var(--side-w);background:#fff;border-right:1px solid var(--line);height:calc(100vh - 46px);overflow-y:auto;position:sticky;top:0;padding:10px 0 40px;}
  .side .catTitle{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;margin:10px 0 2px;letter-spacing:.02em;}
  .side .catTitle:first-child{margin-top:0;}
  .navItem{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #f0f3f7;padding:7px 14px 7px 18px;font-size:12.5px;color:#374151;cursor:pointer;}
  .navItem:hover{background:#f3f7fb;}
  .navItem.active{background:#e5eefb;color:var(--navy-d);font-weight:700;border-left:3px solid var(--accent);padding-left:15px;}
  .navItem .tag{font-size:9.5px;padding:1px 6px;border-radius:8px;flex:0 0 auto;white-space:nowrap;}
  .navItem .tag.ready{background:#e6f4ea;color:var(--ok);}
  .navItem .tag.todo{background:#eef1f5;color:#9aa5b1;}
  .main{flex:1 1 auto;min-width:0;padding:20px 24px 60px;}
  .wrap{max-width:1180px;margin:0 auto;}

  h1.pageTitle{font-size:20px;color:var(--navy-d);text-align:center;border-bottom:3px solid var(--navy);padding-bottom:10px;margin:0 0 4px;}
  h1.pageTitle .sub{display:block;font-size:14.5px;color:var(--accent);margin-top:4px;font-weight:600;}
  h2.bar{font-size:14.5px;color:#fff;background:var(--navy);padding:7px 14px;border-radius:4px;margin:22px 0 0;}
  .sheet{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:0;align-items:start;}
  .cols .left{padding:16px 20px 16px 4px;border-right:1px dashed var(--line);}
  .cols .right{padding:16px 4px 16px 20px;background:var(--panelbg);}
  @media (max-width:980px){
    .layout{flex-direction:column;}
    .side{width:100%;flex:none;height:auto;position:relative;max-height:280px;}
    .cols{grid-template-columns:1fr;} .cols .left{border-right:none;border-bottom:1px dashed var(--line);}
  }

  /* 左：文章の計算書 */
  .lead{font-size:13px;color:#4a5568;margin:2px 0 10px;}
  .sub-head{font-weight:700;color:var(--navy-d);margin:16px 0 4px;font-size:14px;}
  .sub-head::before{content:"・";color:var(--accent);}
  .expl{font-size:13.5px;color:#374151;margin:4px 0;}
  .calc-line{font-family:"Consolas","Yu Gothic",monospace;background:#f7f9fc;border-left:3px solid var(--accent);
    padding:7px 12px;margin:5px 0 5px 8px;font-size:13.5px;color:#20303f;white-space:pre-wrap;line-height:1.65;}
  .note-line{font-size:12px;color:#8996a3;font-style:italic;margin:2px 0 2px 8px;}
  .diagram-wrap{text-align:center;margin:10px 0;padding:8px;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;}
  .diagram-label{font-size:12px;color:#4a5568;margin-top:4px;}
  .final{margin:14px 0;padding:12px;border-radius:6px;font-size:14.5px;font-weight:700;text-align:center;}
  .final-ok{background:#e6f4ea;color:var(--ok);border:1px solid #b7dfc4;}
  .final-ng{background:#fbe9e9;color:var(--ng);border:1px solid #eeb9b9;}

  /* 右：入力・計算結果パネル */
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eef1f5;font-size:13px;}
  .rowline .lbl{color:#4a5568;font-weight:600;min-width:110px;}
  .rowline .val{font-weight:700;color:#16293f;text-align:right;}
  .rowline .val small{font-weight:400;color:#8996a3;margin-left:2px;}
  .rowline input[type=text],.rowline input[type=number],.rowline select{
    width:120px;padding:5px 7px;border:1px solid #c7d0da;border-radius:4px;font-size:13px;text-align:right;background:#fff;
  }
  .rowline select{text-align:left;width:150px;}
  .panel-title{font-weight:700;font-size:13px;color:#fff;background:var(--accent);padding:5px 10px;border-radius:4px;margin:14px 0 4px;}
  .panel-title:first-child{margin-top:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .checkline{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a5568;margin:4px 0;}
  table.sect{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0;}
  table.sect th,table.sect td{border:1px solid var(--line);padding:4px 6px;text-align:center;}
  table.sect th{background:#eef2f7;color:#374151;}
  .btn{background:var(--accent);color:#fff;border:none;padding:11px 34px;border-radius:5px;font-size:15px;cursor:pointer;font-weight:700;margin-top:16px;}
  .btn:hover{background:var(--navy);}
  .btnbar{text-align:center;}
  .badge{display:inline-block;padding:2px 12px;border-radius:12px;font-weight:700;font-size:12px;color:#fff;}
  .badge-ok{background:var(--ok);} .badge-ng{background:var(--ng);} .badge-mute{background:#9aa5b1;}
  .splitcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;}
  .splitcols .box{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;}
  .splitcols .box h4{margin:0 0 6px;font-size:12.5px;color:var(--navy-d);text-align:center;background:#eef2f7;padding:4px;border-radius:3px;}
  .note{font-size:12px;color:#8996a3;margin-top:18px;line-height:1.7;padding:12px;background:#fff;border:1px solid var(--line);border-radius:6px;}
  .formula-ref{font-family:"Consolas",monospace;font-size:13px;color:#20303f;background:#f7f9fc;border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .formula-ref .tag{font-size:11px;color:#8996a3;white-space:nowrap;}

  /* 未実装シート用プレースホルダ */
  .todoWrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:40px 30px;text-align:center;color:#4a5568;}
  .todoWrap .bigTag{display:inline-block;background:#eef1f5;color:#8996a3;font-size:12px;padding:3px 14px;border-radius:12px;margin-bottom:14px;}
  .todoWrap h2{color:var(--navy-d);font-size:18px;margin:0 0 10px;}
  .todoWrap p{font-size:13.5px;line-height:1.8;max-width:560px;margin:0 auto;}
</style>
</head>
<body>
<div class="topbar">
  <h1>強度計算kit<span class="ver">Web版 完成版 v2.0</span></h1>
  <div class="crumb" id="crumb">読み込み中…</div>
</div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main"><div class="wrap" id="main"></div></main>
</div>

<script>
/* ====================================================================
 * 共通ユーティリティ（Excel互換 ROUNDUP / ROUNDDOWN / ROUND ほか）
 * ================================================================== */
function phpRound(num, digits) {
  digits = digits || 0;
  var mult = Math.pow(10, digits);
  var v = num * mult;
  return (v >= 0 ? Math.round(v) : -Math.round(-v)) / mult;
}
function excelRoundup(num, digits) {
  digits = digits || 0;
  num = Number(num);
  var mult = Math.pow(10, digits);
  var val = phpRound(num * mult, 6);
  var result = num >= 0 ? Math.ceil(val) : Math.floor(val);
  return result / mult;
}
function excelRounddown(num, digits) {
  digits = digits || 0;
  num = Number(num);
  var mult = Math.pow(10, digits);
  var val = phpRound(num * mult, 6);
  var result = num >= 0 ? Math.floor(val) : Math.ceil(val);
  return result / mult;
}
function fnum(v, digits) {
  digits = (digits === undefined) ? 2 : digits;
  if (v === '' || v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return '-';
  var n = Number(v);
  var fixed = n.toFixed(digits);
  var parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.length > 1 ? parts.join('.') : parts[0];
}
function h(v) {
  var d = document.createElement('div');
  d.textContent = (v === null || v === undefined) ? '' : String(v);
  return d.innerHTML;
}
function rad2deg(r) { return r * 180 / Math.PI; }
function badge(ok) {
  if (ok === null || ok === undefined) return '<span class="badge badge-mute">-</span>';
  return ok ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-ng">NG</span>';
}
function cmp(ok) {
  if (ok === null || ok === undefined) return '-';
  return ok ? '≦' : '＞';
}
function fval(name, def) {
  var el = document.querySelector('[name="' + name + '"]');
  if (!el) return def;
  if (el.type === 'checkbox') return el.checked;
  var v = el.value;
  return (v === '' || v === null) ? def : v;
}

/* ====================================================================
 * 部材（断面性能）選択ブロック  ※どのシートでも共通の構造
 * ================================================================== */
function memberBlockHTML(preset) {
  return '' +
  '<div class="grid2">' +
    '<div>' +
      '<div class="checkline"><label><input type="radio" name="memberMode" value="list" onclick="toggleMemberMode()" checked> リスト選択（部材をリストから選ぶ）</label></div>' +
      '<div id="listBox" style="margin:6px 0 10px 20px;">' +
        '<select name="memberSelect" id="memberSelect">' +
          '<option value="preset" selected>' + h(preset.label) + '</option>' +
        '</select>' +
        '<div class="note-line" style="margin-left:0;">※他の部材は「任意入力」で断面性能を直接入力してください（元のExcelは部材データベースを外部ブックにリンクしていたため、実データが同梱されているのはこの1点のみです）</div>' +
      '</div>' +
      '<div class="checkline"><label><input type="radio" name="memberMode" value="free" onclick="toggleMemberMode()"> 任意入力（断面性能を直接入力）</label></div>' +
      '<div id="freeBox" style="margin:6px 0 0 20px;">' +
        '<table class="sect">' +
          '<tr><th>商品記号</th><th>板厚(mm)</th><th>単位重量(kg/m)</th><th>断面積(mm²)</th></tr>' +
          '<tr>' +
            '<td><input type="text" name="freeName" value="' + h(preset.label) + '" style="width:120px;"></td>' +
            '<td><input type="number" step="any" name="thickness" value="' + preset.thickness + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="weight" value="' + preset.weight + '" style="width:80px;"></td>' +
            '<td><input type="number" step="any" name="area" value="' + preset.area + '" style="width:80px;"></td>' +
          '</tr>' +
          '<tr><th>Zx(mm³)</th><th>Zy(mm³)</th><th>Ix(mm⁴)</th><th>Iy(mm⁴)</th></tr>' +
          '<tr>' +
            '<td><input type="number" step="any" name="Zx" value="' + preset.Zx + '" style="width:80px;"></td>' +
            '<td><input type="number" step="any" name="Zy" value="' + preset.Zy + '" style="width:80px;"></td>' +
            '<td><input type="number" step="any" name="Ix" value="' + preset.Ix + '" style="width:80px;"></td>' +
            '<td><input type="number" step="any" name="Iy" value="' + preset.Iy + '" style="width:80px;"></td>' +
          '</tr>' +
          '<tr><th>ix(mm)</th><th>iy(mm)</th><th>短期F(N/mm²)</th><th>長期F(N/mm²)</th></tr>' +
          '<tr>' +
            '<td><input type="number" step="any" name="ix" value="' + preset.ix + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="iy" value="' + preset.iy + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="F_short" value="' + preset.F_short + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="F_long" value="' + preset.F_long + '" style="width:70px;"></td>' +
          '</tr>' +
          '<tr><th>E(N/mm²)</th><th>Zpx(mm³)</th><th>Zpy(mm³)</th><th>Zu／Zv</th></tr>' +
          '<tr>' +
            '<td><input type="number" step="any" name="E" value="' + preset.E + '" style="width:80px;"></td>' +
            '<td><input type="number" step="any" name="Zpx" value="' + preset.Zpx + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="Zpy" value="' + preset.Zpy + '" style="width:70px;"></td>' +
            '<td><input type="number" step="any" name="Zu" value="' + (preset.Zu || 0) + '" style="width:34px;">/<input type="number" step="any" name="Zv" value="' + (preset.Zv || 0) + '" style="width:34px;"></td>' +
          '</tr>' +
        '</table>' +
      '</div>' +
    '</div>' +
    '<div id="caseFields"></div>' +
  '</div>';
}
function toggleMemberMode() {
  var el = document.querySelector('input[name="memberMode"]:checked');
  if (!el) return;
  var v = el.value;
  document.getElementById('listBox').style.display = (v === 'list') ? 'block' : 'none';
  document.getElementById('freeBox').style.display = (v === 'free') ? 'block' : 'none';
}
function readMember(preset) {
  var mode = document.querySelector('input[name="memberMode"]:checked').value;
  if (mode === 'list') return { label: preset.label, Zx:preset.Zx, Zy:preset.Zy, Ix:preset.Ix, Iy:preset.Iy, F_short:preset.F_short, F_long:preset.F_long, E:preset.E };
  return {
    label: fval('freeName', preset.label),
    Zx: Number(fval('Zx', preset.Zx)), Zy: Number(fval('Zy', preset.Zy)),
    Ix: Number(fval('Ix', preset.Ix)), Iy: Number(fval('Iy', preset.Iy)),
    F_short: Number(fval('F_short', preset.F_short)), F_long: Number(fval('F_long', preset.F_long)),
    E: Number(fval('E', preset.E))
  };
}

/* ====================================================================
 * 汎用：荷重モデル図（単純梁・集中荷重）
 * ================================================================== */
function beamPointLoadDiagram(opts) {
  var L = 620 - 140; // 描画上の梁の長さ(px) 70〜550
  var x0 = 70, x1 = 550;
  var aFrac = opts.aFrac; // 0..1  荷重位置
  var xFrac = (opts.xFrac === null || opts.xFrac === undefined) ? null : opts.xFrac;
  var apos = x0 + (x1 - x0) * aFrac;
  var svg = '<svg viewBox="0 0 620 176" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">';
  svg += '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="9" orient="auto"><path d="M0,0 L9,0 L4.5,9 z" fill="#c53030"/></marker>' +
         '<marker id="arm" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto"><path d="M0,0 L7,0 L3.5,7 z" fill="#c53030"/></marker></defs>';
  svg += '<line x1="' + apos + '" y1="18" x2="' + apos + '" y2="68" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>';
  svg += '<text x="' + apos + '" y="14" text-anchor="middle" font-size="14" fill="#c53030" font-weight="bold">' + (opts.loadLabel || 'P') + '</text>';
  if (xFrac !== null) {
    var xpos = x0 + (x1 - x0) * xFrac;
    svg += '<line x1="' + xpos + '" y1="68" x2="' + xpos + '" y2="90" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4,3"/>';
    svg += '<text x="' + xpos + '" y="104" text-anchor="middle" font-size="12" fill="#2b6cb0">x</text>';
  }
  svg += '<line x1="' + x0 + '" y1="68" x2="' + x1 + '" y2="68" stroke="#1f3a5f" stroke-width="6"/>';
  svg += '<polygon points="' + x0 + ',68 ' + (x0 - 14) + ',96 ' + (x0 + 14) + ',96" fill="#1f3a5f"/>';
  svg += '<polygon points="' + x1 + ',68 ' + (x1 - 14) + ',96 ' + (x1 + 14) + ',96" fill="#1f3a5f"/>';
  svg += '<circle cx="' + (x1 - 7) + '" cy="100" r="4.5" fill="#1f3a5f"/><circle cx="' + (x1 + 7) + '" cy="100" r="4.5" fill="#1f3a5f"/>';
  svg += '<text x="' + x0 + '" y="132" text-anchor="middle" font-size="12" fill="#374151">RA</text>';
  svg += '<text x="' + x1 + '" y="132" text-anchor="middle" font-size="12" fill="#374151">RB</text>';
  if (opts.showAB) {
    svg += '<line x1="' + x0 + '" y1="150" x2="' + apos + '" y2="150" stroke="#8996a3" stroke-width="1"/>';
    svg += '<line x1="' + x0 + '" y1="145" x2="' + x0 + '" y2="155" stroke="#8996a3" stroke-width="1"/>';
    svg += '<line x1="' + apos + '" y1="145" x2="' + apos + '" y2="155" stroke="#8996a3" stroke-width="1"/>';
    svg += '<text x="' + ((x0 + apos) / 2) + '" y="166" text-anchor="middle" font-size="12" fill="#4a5568">a</text>';
    svg += '<line x1="' + apos + '" y1="150" x2="' + x1 + '" y2="150" stroke="#8996a3" stroke-width="1"/>';
    svg += '<line x1="' + x1 + '" y1="145" x2="' + x1 + '" y2="155" stroke="#8996a3" stroke-width="1"/>';
    svg += '<text x="' + ((apos + x1) / 2) + '" y="166" text-anchor="middle" font-size="12" fill="#4a5568">b</text>';
  } else {
    svg += '<line x1="' + x0 + '" y1="150" x2="' + x1 + '" y2="150" stroke="#8996a3" stroke-width="1"/>';
    svg += '<line x1="' + x0 + '" y1="145" x2="' + x0 + '" y2="155" stroke="#8996a3" stroke-width="1"/>';
    svg += '<line x1="' + x1 + '" y1="145" x2="' + x1 + '" y2="155" stroke="#8996a3" stroke-width="1"/>';
    svg += '<text x="' + ((x0 + x1) / 2) + '" y="166" text-anchor="middle" font-size="12" fill="#4a5568">L</text>';
  }
  svg += '</svg>';
  return svg;
}
function beamTwoPointSymDiagram(opts) {
  var x0 = 70, x1 = 550;
  var aFrac = opts.aFrac; // 0..1  支点からの荷重位置(a/L)
  var bFrac = 1 - aFrac;
  var xFrac = (opts.xFrac === null || opts.xFrac === undefined) ? null : opts.xFrac;
  var apos = x0 + (x1 - x0) * aFrac;
  var bpos = x0 + (x1 - x0) * bFrac;
  var svg = '<svg viewBox="0 0 620 176" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">';
  svg += '<defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="4.5" refY="9" orient="auto"><path d="M0,0 L9,0 L4.5,9 z" fill="#c53030"/></marker></defs>';
  [apos, bpos].forEach(function (p) {
    svg += '<line x1="' + p + '" y1="18" x2="' + p + '" y2="68" stroke="#c53030" stroke-width="3" marker-end="url(#ar2)"/>';
    svg += '<text x="' + p + '" y="14" text-anchor="middle" font-size="14" fill="#c53030" font-weight="bold">' + (opts.loadLabel || 'P') + '</text>';
  });
  if (xFrac !== null) {
    var xpos = x0 + (x1 - x0) * xFrac;
    svg += '<line x1="' + xpos + '" y1="68" x2="' + xpos + '" y2="90" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4,3"/>';
    svg += '<text x="' + xpos + '" y="104" text-anchor="middle" font-size="12" fill="#2b6cb0">x</text>';
  }
  svg += '<line x1="' + x0 + '" y1="68" x2="' + x1 + '" y2="68" stroke="#1f3a5f" stroke-width="6"/>';
  svg += '<polygon points="' + x0 + ',68 ' + (x0 - 14) + ',96 ' + (x0 + 14) + ',96" fill="#1f3a5f"/>';
  svg += '<polygon points="' + x1 + ',68 ' + (x1 - 14) + ',96 ' + (x1 + 14) + ',96" fill="#1f3a5f"/>';
  svg += '<circle cx="' + (x1 - 7) + '" cy="100" r="4.5" fill="#1f3a5f"/><circle cx="' + (x1 + 7) + '" cy="100" r="4.5" fill="#1f3a5f"/>';
  svg += '<text x="' + x0 + '" y="132" text-anchor="middle" font-size="12" fill="#374151">RA</text>';
  svg += '<text x="' + x1 + '" y="132" text-anchor="middle" font-size="12" fill="#374151">RB</text>';
  var pts = [x0, apos, bpos, x1];
  var labels = opts.segLabels || ['a', 'b', 'a'];
  for (var i = 0; i < 3; i++) {
    svg += '<line x1="' + pts[i] + '" y1="150" x2="' + pts[i + 1] + '" y2="150" stroke="#8996a3" stroke-width="1"/>';

      html += '</div></div></div>';
    }

    html += '<h2 class="bar">④ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html += '<div class="formula-ref"><span>RA ＝ RB ＝ P／2</span></div>';
    html += '<div class="formula-ref"><span>Mmax ＝ PL／4</span><span class="tag">〔荷重点〕</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ Px／2</span><span class="tag">〔0≦x≦L/2〕</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ P(L－x)／2</span><span class="tag">〔L/2≦x≦L〕</span></div>';
    html += '</div><div>';
    html += '<div class="formula-ref"><span>δmax ＝ PL³／(48EI)</span><span class="tag">〔荷重点〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ Px(3L²－4x²)／(48EI)</span><span class="tag">〔0≦x≦L/2〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ P(L－x)[3L²－4(L－x)²]／(48EI)</span><span class="tag">〔L/2≦x≦L〕</span></div>';
    html += '<div class="formula-ref"><span>θA ＝ －θB ＝ PL²／(16EI)</span></div>';

  }
};

CASES.S2 = {

      '<h1 class="pageTitle">【単純梁 任意一点集中荷重】<span class="sub" id="titleSub">' + h(preset.label) + ' の強度計算</span></h1>' +
      '<form id="calcForm" onsubmit="return false;">' +
        '<h2 class="bar">① 部材選択 ・ 設定値入力</h2>' +

    document.getElementById('caseFields').innerHTML =
      '<div class="rowline"><span class="lbl">支持長さ L</span><span><input type="number" step="any" name="L" value="2000" oninput="CASES.S2.syncB()"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">荷重位置 a</span><span><input type="number" step="any" name="a" value="1500" oninput="CASES.S2.syncB()"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">b（＝L－a）</span><span><input type="number" step="any" name="b" value="500" readonly style="background:#f3f5f8;"> <small>mm</small></span></div>' +
      '<div class="rowline"><span class="lbl">集中荷重 P</span><span><input type="number" step="any" name="P" value="1000"> <small>N</small></span></div>' +
      '<div class="rowline"><span class="lbl">検討軸</span><span><select name="axis"><option value="X" selected>X（強軸）</option><option value="Y">Y（弱軸）</option></select></span></div>' +
      '<div class="rowline"><span class="lbl">検討期間</span><span><select name="term"><option value="短期" selected>短期</option><option value="長期">長期</option></select></span></div>' +
      '<div class="rowline"><span class="lbl">たわみ率 L/</span><span><input type="number" step="any" name="FREX" value="200"></span></div>' +
      '<div class="checkline"><input type="checkbox" name="frexOn" checked> たわみ判定を行う（ON）</div>' +
      '<div class="rowline"><span class="lbl">任意位置 x</span><span><input type="number" step="any" name="x" value="1000"> <small>mm</small></span></div>' +
      '<div class="checkline"><input type="checkbox" name="xEnabled" checked> 任意位置xの計算を行う</div>';
    toggleMemberMode();

  },
  syncB: function () {
    var L = Number(fval('L', 2000)), a = Number(fval('a', 1500));
    document.querySelector('[name="b"]').value = (L - a);
  },
  run: function () {
    this.syncB();
    var preset = this.preset;
    var mode = document.querySelector('input[name="memberMode"]:checked').value;
    var m = readMember(preset);
    var Zx = (mode === 'list') ? preset.Zx : Number(fval('Zx', preset.Zx));
    var Zy = (mode === 'list') ? preset.Zy : Number(fval('Zy', preset.Zy));
    var Ix = (mode === 'list') ? preset.Ix : Number(fval('Ix', preset.Ix));
    var Iy = (mode === 'list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 2000)), a = Number(fval('a', 1500)), b = L - a, P = Number(fval('P', 1000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);
    var x = Number(fval('x', 1000)), xEnabled = fval('xEnabled', false);

    var Z = (axis === 'X') ? Zx : Zy, I = (axis === 'X') ? Ix : Iy;
    var F = (term === '短期') ? m.F_short : m.F_long;
    var E = m.E;
    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var RA = excelRoundup(P * b / L, 2), RB = excelRoundup(P * a / L, 2);
    var Mmax = excelRoundup(P * a * b / L, 2);
    var sigma_b = excelRoundup(Mmax / Z, 2), sigma_b_judge = (sigma_b <= F);

    var aLCHK = (a <= L / 2) ? 1 : 2;
    var deltaMaxX, deltaMax;
    if (aLCHK === 1) { deltaMaxX = phpRound(Math.sqrt(b * (b + 2 * a) / 3), 2); deltaMax = excelRoundup(P * a * Math.pow(L * L - a * a, 1.5) / (9 * Math.sqrt(3) * E * I * L), 2); }
    else { deltaMaxX = phpRound(Math.sqrt(a * (a + 2 * b) / 3), 2); deltaMax = excelRoundup(P * b * Math.pow(L * L - b * b, 1.5) / (9 * Math.sqrt(3) * E * I * L), 2); }
    var L_over_deltamax = (deltaMax !== 0) ? excelRounddown(L / deltaMax, 0) : '-';
    var deltaMax_judge = frexOn ? (Math.abs(deltaMax) <= L / FREX) : null;
    var CHK1 = sigma_b_judge && (frexOn ? deltaMax_judge : true);

    var thetaA = P * b * (L * L - b * b) / (6 * E * I * L);
    var thetaB = -P * a * (L * L - a * a) / (6 * E * I * L);
    var thetaA_rad = phpRound(thetaA, 6), thetaA_deg = phpRound(rad2deg(thetaA), 4);
    var thetaB_rad = phpRound(thetaB, 6), thetaB_deg = phpRound(rad2deg(thetaB), 4);

    var hasX = xEnabled, xJudgeText = '-', xsctCHK = null, Mx = null, sigma_bx = null,
        delta_x = null, L_over_deltax = null, sigma_bx_judge = null, delta_x_judge = null,
        delta_a = null, L_over_deltaa = null, delta_a_judge = null, CHK2 = null;
    if (hasX) {
      xsctCHK = (x === a) ? 1 : (x < a ? 1 : 2);
      xJudgeText = (x === a) ? 'x＝a' : (x < a ? 'x≦a' : 'x≧a');
      if (xsctCHK === 1) { Mx = excelRoundup(P * b * x / L, 2); delta_x = excelRoundup(P * b * x * (L * L - b * b - x * x) / (6 * E * I * L), 2); }
      else { Mx = excelRoundup(P * a * (L - x) / L, 2); delta_x = excelRoundup(P * a * (L - x) * (2 * L * x - x * x - a * a) / (6 * E * I * L), 2); }
      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);
      L_over_deltax = (delta_x !== 0) ? excelRounddown(L / delta_x, 0) : '-';
      delta_x_judge = frexOn ? (Math.abs(delta_x) <= L / FREX) : null;
      delta_a = excelRoundup(P * a * a * b * b / (3 * E * I * L), 2);
      L_over_deltaa = (delta_a !== 0) ? excelRounddown(L / delta_a, 0) : '-';
      delta_a_judge = frexOn ? (delta_a <= L / FREX) : null;
      CHK2 = sigma_bx_judge && (frexOn ? (delta_x_judge && delta_a_judge) : true);
    }

    document.getElementById('titleSub').textContent = m.label + ' の強度計算';
    var r = { m:m, prtName:m.label, L:L, a:a, b:b, P:P, term:term, FREX:FREX, frexOn:frexOn, x:x,
      Z:Z, I:I, F:F, ZLabel:ZLabel, ILabel:ILabel, E:E, RA:RA, RB:RB, Mmax:Mmax, sigma_b:sigma_b, sigma_b_judge:sigma_b_judge,
      aLCHK:aLCHK, deltaMaxX:deltaMaxX, deltaMax:deltaMax, L_over_deltamax:L_over_deltamax, deltaMax_judge:deltaMax_judge, CHK1:CHK1,
      thetaA_rad:thetaA_rad, thetaA_deg:thetaA_deg, thetaB_rad:thetaB_rad, thetaB_deg:thetaB_deg,
      hasX:hasX, xJudgeText:xJudgeText, xsctCHK:xsctCHK, Mx:Mx, sigma_bx:sigma_bx, sigma_bx_judge:sigma_bx_judge,
      delta_x:delta_x, L_over_deltax:L_over_deltax, delta_x_judge:delta_x_judge,
      delta_a:delta_a, L_over_deltaa:L_over_deltaa, delta_a_judge:delta_a_judge, CHK2:CHK2 };
    document.getElementById('results').innerHTML = this.renderResults(r);
  },
  renderResults: function (r) {
    var aFrac = (r.L > 0) ? r.a / r.L : 0.5;

    html += '<div class="calc-line">RB ＝ Pa／L ＝ ' + fnum(r.P, 0) + 'N×' + fnum(r.a, 0) + 'mm／' + fnum(r.L, 0) + 'mm ＝ ' + fnum(r.RB) + 'N</div>';
    html += '<div class="sub-head">モーメントMmax</div><div class="calc-line">Mmax ＝ Pab／L ＝ ' + fnum(r.P, 0) + 'N×' + fnum(r.a, 0) + 'mm×' + fnum(r.b, 0) + 'mm／' + fnum(r.L, 0) + 'mm ＝ ' + fnum(r.Mmax) + 'N・mm</div>';
    html += '<div class="sub-head">' + r.term + '曲げ応力度σb</div><div class="calc-line">σb ＝ Mmax／Z ＝ ' + fnum(r.Mmax) + 'N・mm／' + fnum(r.Z) + 'mm³ ＝ ' + fnum(r.sigma_b) + 'N/mm² ' + cmp(r.sigma_b_judge) + ' ' + fnum(r.F, 0) + 'N/mm²　' + (r.sigma_b_judge ? 'OK' : 'NG') + '</div>';
    html += '<div class="sub-head">たわみδmax（' + (r.aLCHK === 1 ? 'a≦L/2' : 'a＞L/2') + 'の場合）</div>';
    html += '<div class="calc-line">x ＝ √{' + (r.aLCHK === 1 ? 'b(b＋2a)／3' : 'a(a＋2b)／3') + '} ＝ ' + fnum(r.deltaMaxX) + 'mm にて\nδmax ＝ ' + (r.aLCHK === 1 ? 'Pa(L²－a²)^1.5／(9√3EIL)' : 'Pb(L²－b²)^1.5／(9√3EIL)') + '\n　＝ ' + fnum(r.deltaMax) + 'mm' + (r.frexOn ? ' (1/' + r.L_over_deltamax + ' ' + cmp(r.deltaMax_judge) + ' 1/' + fnum(r.FREX, 0) + ' ' + (r.deltaMax_judge ? 'OK' : 'NG') + ')' : '') + '</div>';
    html += '<div class="final ' + (r.CHK1 ? 'final-ok' : 'final-ng') + '">以上計算より、' + h(r.prtName) + 'は設定の条件において強度上問題' + (r.CHK1 ? '無い。' : '有り、要再検討！') + '</div>';
    html += '<div class="sub-head">たわみ角θA，θB</div>';
    html += '<div class="calc-line">θA ＝ Pb(L²－b²)／(6EIL) ＝ ' + fnum(r.thetaA_rad, 6) + 'rad (' + fnum(r.thetaA_deg, 4) + '°)</div>';
    html += '<div class="calc-line">θB ＝ －Pa(L²－a²)／(6EIL) ＝ ' + fnum(r.thetaB_rad, 6) + 'rad (' + fnum(r.thetaB_deg, 4) + '°)</div>';
    html += '</div>';
    html += '<div class="right">';
    html += '<div class="panel-title">部材</div><div class="rowline"><span class="lbl">部材</span><span class="val">' + h(r.prtName) + '</span></div>';
    html += '<div class="panel-title">計算結果</div>';

      html += '<div class="rowline"><span class="lbl">_CHK2</span><span class="val">' + badge(r.CHK2) + '</span></div>';

    }

    html += '<h2 class="bar">④ 公式（一般式）</h2><div class="sheet"><div class="grid2"><div>';
    html += '<div class="formula-ref"><span>RA ＝ Pb／L</span></div>';

    html += '<div class="formula-ref"><span>Mmax ＝ Pab／L</span><span class="tag">〔荷重点〕</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ Pbx／L</span><span class="tag">〔0≦x≦a〕</span></div>';
    html += '<div class="formula-ref"><span>Mx ＝ Pa(L－x)／L</span><span class="tag">〔a≦x≦L〕</span></div>';
    html += '</div><div>';
    html += '<div class="formula-ref"><span>δmax ＝ Pa(L²－a²)^1.5／(9√3EIL)</span><span class="tag">〔a≦L/2〕</span></div>';
    html += '<div class="formula-ref"><span>δmax ＝ Pb(L²－b²)^1.5／(9√3EIL)</span><span class="tag">〔a＞L/2〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ Pbx(L²－b²－x²)／(6EIL)</span><span class="tag">〔0≦x≦a〕</span></div>';
    html += '<div class="formula-ref"><span>δx ＝ Pa(L－x)(2Lx－x²－a²)／(6EIL)</span><span class="tag">〔a≦x≦L〕</span></div>';
    html += '<div class="formula-ref"><span>δa ＝ Pa²b²／(3EIL)</span><span class="tag">〔荷重点〕</span></div>';
    html += '</div></div></div>';

  }
};

      '<div class="rowline"><span class="lbl">支持長さ L</span><span><input type="number" step="any" name="L" value="3000" oninput="CASES.S3.syncB()"> <small>mm</small></span></div>' +

      '<div class="rowline"><span class="lbl">検討期間</span><span><select name="term"><option value="短期" selected>短期</option><option value="長期">長期</option></select></span></div>' +

  syncB: function () {
    var L = Number(fval('L', 3000)), a = Number(fval('a', 500));
    document.querySelector('[name="b"]').value = (L - 2 * a);
  },
  run: function () {
    this.syncB();
    var preset = this.preset;
    var mode = document.querySelector('input[name="memberMode"]:checked').value;
    var m = readMember(preset);
    var Zx = (mode === 'list') ? preset.Zx : Number(fval('Zx', preset.Zx));
    var Zy = (mode === 'list') ? preset.Zy : Number(fval('Zy', preset.Zy));
    var Ix = (mode === 'list') ? preset.Ix : Number(fval('Ix', preset.Ix));
    var Iy = (mode === 'list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 3000)), a = Number(fval('a', 500)), b = L - 2 * a, P = Number(fval('P', 1000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);
    var x = Number(fval('x', 2500)), xEnabled = fval('xEnabled', false);

    var Z = (axis === 'X') ? Zx : Zy, I = (axis === 'X') ? Ix : Iy;
    var F = (term === '短期') ? m.F_short : m.F_long;
    var E = m.E;
    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var R = excelRoundup(P, 2);
    var Mmax = excelRoundup(P * a, 2);
    var sigma_b = excelRoundup(Mmax / Z, 2), sigma_b_judge = (sigma_b <= F);

    var deltaMax = excelRoundup(P * a * (3 * L * L - 4 * a * a) / (24 * E * I), 2);
    var L_over_deltamax = (deltaMax !== 0) ? excelRounddown(L / deltaMax, 0) : '-';
    var deltaMax_judge = frexOn ? (Math.abs(deltaMax) <= L / FREX) : null;
    var CHK1 = sigma_b_judge && (frexOn ? deltaMax_judge : true);

    var thetaA = P * a * (L - a) / (2 * E * I);
    var thetaA_rad = phpRound(thetaA, 6), thetaA_deg = phpRound(rad2deg(thetaA), 4);

    var hasX = xEnabled, xJudgeText = '-', xsctCHK = null, Mx = null, sigma_bx = null,
        delta_x = null, L_over_deltax = null, sigma_bx_judge = null, delta_x_judge = null,
        delta_a = null, L_over_deltaa = null, delta_a_judge = null, CHK2 = null;
    if (hasX) {
      xsctCHK = (x <= a) ? 1 : (x <= (L - a) ? 2 : 3);
      xJudgeText = (xsctCHK === 1) ? '0≦x≦a' : (xsctCHK === 2 ? 'a≦x≦(L-a)' : '(L-a)≦x≦L');
      if (xsctCHK === 1) {
        Mx = excelRoundup(P * x, 2);
        delta_x = excelRoundup(P * x * (3 * L * a - 3 * a * a - x * x) / (6 * E * I), 2);
      } else if (xsctCHK === 2) {
        Mx = excelRoundup(P * a, 2);
        delta_x = excelRoundup(P * a * (3 * L * x - 3 * x * x - a * a) / (6 * E * I), 2);
      } else {
        Mx = excelRoundup(P * (L - x), 2);
        delta_x = excelRoundup(P * (L - x) * (3 * L * a - 3 * a * a - Math.pow(L - x, 2)) / (6 * E * I), 2);
      }
      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);
      L_over_deltax = (delta_x !== 0) ? excelRounddown(L / delta_x, 0) : '-';
      delta_x_judge = frexOn ? (Math.abs(delta_x) <= L / FREX) : null;
      delta_a = excelRoundup(P * a * a * (3 * L - 4 * a) / (6 * E * I), 2);
      L_over_deltaa = (delta_a !== 0) ? excelRounddown(L / delta_a, 0) : '-';
      delta_a_judge = frexOn ? (delta_a <= L / FREX) : null;
      CHK2 = sigma_bx_judge && (frexOn ? (delta_x_judge && delta_a_judge) : true);
    }

    document.getElementById('titleSub').textContent = m.label + ' の強度計算';
    var r = { m:m, prtName:m.label, L:L, a:a, b:b, P:P, term:term, FREX:FREX, frexOn:frexOn, x:x,
      Z:Z, I:I, F:F, ZLabel:ZLabel, ILabel:ILabel, E:E, R:R, Mmax:Mmax, sigma_b:sigma_b, sigma_b_judge:sigma_b_judge,
      deltaMax:deltaMax, L_over_deltamax:L_over_deltamax, deltaMax_judge:deltaMax_judge, CHK1:CHK1,
      thetaA_rad:thetaA_rad, thetaA_deg:thetaA_deg,
      hasX:hasX, xJudgeText:xJudgeText, xsctCHK:xsctCHK, Mx:Mx, sigma_bx:sigma_bx, sigma_bx_judge:sigma_bx_judge,
      delta_x:delta_x, L_over_deltax:L_over_deltax, delta_x_judge:delta_x_judge,
      delta_a:delta_a, L_over_deltaa:L_over_deltaa, delta_a_judge:delta_a_judge, CHK2:CHK2 };
    document.getElementById('results').innerHTML = this.renderResults(r);
  },

    html += '<div class="rowline"><span class="lbl">δmax</span><span class="val">' + fnum(r.deltaMax) + ' <small>mm</small></span></div>';

  run: function () {
    var preset = this.preset;
    var mode = document.querySelector('input[name="memberMode"]:checked').value;
    var m = readMember(preset);
    var Zx = (mode === 'list') ? preset.Zx : Number(fval('Zx', preset.Zx));
    var Zy = (mode === 'list') ? preset.Zy : Number(fval('Zy', preset.Zy));
    var Ix = (mode === 'list') ? preset.Ix : Number(fval('Ix', preset.Ix));
    var Iy = (mode === 'list') ? preset.Iy : Number(fval('Iy', preset.Iy));

    var axis = fval('axis', 'X');
    var L = Number(fval('L', 3000)), P = Number(fval('P', 1000));
    var term = fval('term', '短期'), FREX = Number(fval('FREX', 200)), frexOn = fval('frexOn', false);
    var x = Number(fval('x', 2000)), xEnabled = fval('xEnabled', false);

    var Z = (axis === 'X') ? Zx : Zy, I = (axis === 'X') ? Ix : Iy;
    var F = (term === '短期') ? m.F_short : m.F_long;

    var ZLabel = (axis === 'X') ? 'Zx' : 'Zy', ILabel = (axis === 'X') ? 'Ix' : 'Iy';

    var Mmax = excelRoundup(P * L / 3, 2);
    var sigma_b = excelRoundup(Mmax / Z, 2), sigma_b_judge = (sigma_b <= F);

CASES.S5 = {
  preset: { label:'C-100×50×20×2.3', thickness:2.3, weight:4.035, area:517.217,
    Zx:16100, Zy:6060, Ix:807000, Iy:190000, ix:39.5, iy:19.2,
    F_short:205, F_long:136, Zu:0, Zv:0, E:205000, Zpx:18950, Zpy:8676 },
  delta1: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * (L - a) * (2 * L * a - a * a - x * x) + P2 * b * (L * L - b * b - x * x)) * x / (6 * E * I * L);
  },
  delta2: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * a * (L - x) * (2 * L * x - x * x - a * a) + P2 * b * x * (L * L - b * b - x * x)) / (6 * E * I * L);
  },
  delta3: function (x, P1, P2, L, a, b, E, I) {
    return (P1 * a * (2 * L * x - x * x - a * a) + P2 * (L - b) * (2 * L * x - x * x - (L - b) * (L - b))) * (L - x) / (6 * E * I * L);

  syncC: function () {

    }

    var MmaxLabel = (M1 >= M2) ? 'M1' : 'M2';
    var Mmax = (M1 >= M2) ? M1 : M2;
    var sigma_b = excelRoundup(Mmax / Z, 2);
    var sigma_b_judge = (sigma_b <= F);

    var seg1 = scanMaxAbs(function (xi) { return CASES.S5.delta1(xi, P1, P2, L, a, b, E, I); }, 0, a);

      sigma_bx = excelRoundup(Mx / Z, 2); sigma_bx_judge = (sigma_bx <= F);

    toggleMemberMode(); this.run();
  },
  run:function(){
    var p=this.preset, m=readMember(p);
    var mode=document.querySelector('input[name="memberMode"]:checked').value;
    var Zx=(mode==='list')?p.Zx:Number(fval('Zx',p.Zx)), Zy=(mode==='list')?p.Zy:Number(fval('Zy',p.Zy));
    var Ix=(mode==='list')?p.Ix:Number(fval('Ix',p.Ix)), Iy=(mode==='list')?p.Iy:Number(fval('Iy',p.Iy));
    var axis=fval('axis','X'), term=fval('term','短期'), FREX=Number(fval('FREX',200)), frexOn=fval('frexOn',false);
    var L=Number(fval('L',3000)), P=Number(fval('P',1000));
    var Z=(axis==='X')?Zx:Zy, I=(axis==='X')?Ix:Iy;
    var F=(term==='短期')?m.F_short:m.F_long, E=m.E;
    var ZLabel=(axis==='X')?'Zx':'Zy', ILabel=(axis==='X')?'Ix':'Iy';
    // 3点均等荷重: a=L/6, RA=RB=3P/2, Mmax=Pa (荷重点間一定)
    var a=L/6;
    var RA=excelRoundup(3*P/2,2);
    var Mmax=excelRoundup(P*a,2); // = PL/6
    var sigma_b=excelRoundup(Mmax/Z,2), sigma_b_judge=(sigma_b<=F);

    var deltaMax=excelRoundup(19*P*Math.pow(L,3)/(384*E*I),2);
    var Lov=(deltaMax!==0)?excelRounddown(L/deltaMax,0):'-';
    var dj=frexOn?(Math.abs(deltaMax)<=L/FREX):null;
    var CHK1=sigma_b_judge&&(frexOn?dj:true);

    var r={prtName:m.label,L:L,P:P,a:a,term:term,FREX:FREX,frexOn:frexOn,Z:Z,I:I,F:F,ZLabel:ZLabel,ILabel:ILabel,E:E,RA:RA,Mmax:Mmax,sigma_b:sigma_b,sigma_b_judge:sigma_b_judge,deltaMax:deltaMax,Lov:Lov,dj:dj,CHK1:CHK1};
    document.getElementById('results').innerHTML=this.renderResults(r);
  },

    html+='<div class="sub-head">たわみδmax</div><div class="calc-line">δmax ＝ 19PL³／(384EI) ＝ '+fnum(r.deltaMax)+'mm'+(r.frexOn?' (1/'+r.Lov+' '+cmp(r.dj)+' 1/'+fnum(r.FREX,0)+' '+(r.dj?'OK':'NG')+')':'')+'</div>';
    html+='<div class="final '+(r.CHK1?'final-ok':'final-ng')+'">以上計算より、'+h(r.prtName)+'は設定の条件において強度上問題'+(r.CHK1?'無い。':'有り、要再検討！')+'</div>';

function makeFlatPlate(id, title, note, kMult, deltaK){
  CASES[id] = {
    preset:{},
    mount:function(main){
      main.innerHTML='<h1 class="pageTitle">【'+title+'】<span class="sub">平板（矩形板）の強度計算</span></h1>'+
        '<form id="calcForm" onsubmit="return false;"><h2 class="bar">① 設定値入力</h2>'+
        '<div class="sheet"><div id="caseFields">'+
        '<div class="rowline"><span class="lbl">板幅 a（長辺）</span><span><input type="number" step="any" name="a" value="500"> <small>mm</small></span></div>'+
        '<div class="rowline"><span class="lbl">板幅 b（短辺）</span><span><input type="number" step="any" name="b" value="300"> <small>mm</small></span></div>'+
        '<div class="rowline"><span class="lbl">板厚 t</span><span><input type="number" step="any" name="t" value="6"> <small>mm</small></span></div>'+
        '<div class="rowline"><span class="lbl">荷重 q（面圧）</span><span><input type="number" step="any" name="q" value="0.1"> <small>N/mm²</small></span></div>'+
        '<div class="rowline"><span class="lbl">ヤング率 E</span><span><input type="number" step="any" name="E2" value="205000"> <small>N/mm²</small></span></div>'+
        '<div class="rowline"><span class="lbl">ポアソン比 ν</span><span><input type="number" step="any" name="nu" value="0.3"></span></div>'+
        '<div class="rowline"><span class="lbl">許容応力度 F</span><span><input type="number" step="any" name="F2" value="205"> <small>N/mm²</small></span></div>'+
        '</div><div class="btnbar"><button type="button" class="btn" onclick="CASES[\''+id+'\'].run()">計 算 す る</button></div></div></form>'+
        '<div id="results"></div>'+
        '<div class="note">※ '+note+'</div>';
    },
    run:function(){
      var a=Number(fval('a',500)), b=Number(fval('b',300)), t=Number(fval('t',6));
      var q=Number(fval('q',0.1)), E2=Number(fval('E2',205000)), nu=Number(fval('nu',0.3)), F2=Number(fval('F2',205));
      var D=excelRoundup(E2*t*t*t/(12*(1-nu*nu)),2);
      var k=kMult;
      var sigma_max=excelRoundup(k*q*b*b/(t*t),2);
      var judge_s=(sigma_max<=F2);
      var delta_max=excelRoundup(deltaK*q*Math.pow(b,4)/(E2*t*t*t),2);
      var Lov=(delta_max!==0)?excelRounddown(b/delta_max,0):'-';
      var html='<h2 class="bar">② 平板強度計算結果</h2><div class="sheet"><div class="cols"><div class="left">';
      html+='<div class="lead">a='+fnum(a,0)+'mm　b='+fnum(b,0)+'mm　t='+fnum(t,0)+'mm　q='+fnum(q,4)+'N/mm²</div>';
      html+='<div class="sub-head">曲げ剛性 D</div><div class="calc-line">D ＝ Et³／[12(1-ν²)] ＝ '+fnum(D)+'N・mm</div>';
      html+='<div class="sub-head">最大応力度 σmax</div><div class="calc-line">σmax ＝ k×q×b²／t² ＝ '+fnum(k,4)+'×'+fnum(q,4)+'×'+fnum(b*b,0)+'／'+fnum(t*t,0)+' ＝ '+fnum(sigma_max)+'N/mm² '+cmp(judge_s)+' '+fnum(F2,0)+'N/mm²　'+(judge_s?'OK':'NG')+'</div>';
      html+='<div class="sub-head">最大たわみ δmax</div><div class="calc-line">δmax ＝ α×q×b⁴／(Et³) ＝ '+fnum(delta_max)+'mm　（b/δ ＝ '+Lov+'）</div>';
      html+='<div class="final '+(judge_s?'final-ok':'final-ng')+'">以上計算より、平板は強度上問題'+(judge_s?'無い。':'有り、要再検討！')+'</div>';
      html+='</div><div class="right"><div class="panel-title">計算結果</div>';
      html+='<div class="rowline"><span class="lbl">D</span><span class="val">'+fnum(D)+' <small>N・mm</small></span></div>';
      html+='<div class="rowline"><span class="lbl">σmax</span><span class="val">'+fnum(sigma_max)+' <small>N/mm²</small></span></div>';
      html+='<div class="rowline"><span class="lbl">σ判定</span><span class="val">'+cmp(judge_s)+' '+badge(judge_s)+'</span></div>';
      html+='<div class="rowline"><span class="lbl">δmax</span><span class="val">'+fnum(delta_max)+' <small>mm</small></span></div>';
      html+='<div class="rowline"><span class="lbl">b/δmax</span><span class="val">'+Lov+'</span></div>';
      html+='</div></div></div>';
      document.getElementById('results').innerHTML=html;
    }
  };
}

      var nm=fval('wdname_'+i,'部材'+(i+1));
      var w=Number(fval('wdw_'+i,0));
      var x=Number(fval('wdx_'+i,0));
      var y=Number(fval('wdy_'+i,0));
      Wtotal+=w; WXtotal+=w*x; WYtotal+=w*y;
      rows+='<div class="rowline"><span class="lbl">'+h(nm)+'</span><span>W='+fnum(w,0)+'N　X='+fnum(x,0)+'mm　Y='+fnum(y,0)+'mm　WX='+fnum(w*x,0)+'　WY='+fnum(w*y,0)+'</span></div>';
    }
    var Xg=excelRoundup(WXtotal/Wtotal,2), Yg=excelRoundup(WYtotal/Wtotal,2);
    Wtotal=excelRoundup(Wtotal,2);
    var html='<h2 class="bar">② 重量・重心計算結果</h2><div class="sheet">';
    html+=rows;
    html+='<div class="sub-head" style="margin-top:12px">合計重量</div><div class="calc-line">W ＝ '+fnum(Wtotal,0)+' N</div>';
    html+='<div class="sub-head">重心X座標</div><div class="calc-line">Xg ＝ ΣWX／ΣW ＝ '+fnum(Xg)+' mm</div>';
    html+='<div class="sub-head">重心Y座標</div><div class="calc-line">Yg ＝ ΣWY／ΣW ＝ '+fnum(Yg)+' mm</div>';
    html+='<div class="rowline" style="margin-top:12px"><span class="lbl">合計重量</span><span class="val">'+fnum(Wtotal,0)+' <small>N</small></span></div>';
    html+='<div class="rowline"><span class="lbl">重心 X</span><span class="val">'+fnum(Xg)+' <small>mm</small></span></div>';
    html+='<div class="rowline"><span class="lbl">重心 Y</span><span class="val">'+fnum(Yg)+' <small>mm</small></span></div>';
    html+='</div>';
    document.getElementById('results').innerHTML=html;
  }
};

</script>
</body>
</html>
